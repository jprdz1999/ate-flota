<!DOCTYPE html>
<html lang="es">

<style>

<body>
<div class="wrap" id="root" style="max-width:520px"><div class="loading-screen"><span class="spinner"></span>Cargando...</div></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://mxxvphizdhinixnhtulm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WB81yFJaOP0p4b7wiCcWDg_ajhjT68G';

const CITIES = {
  tj:'Tijuana', mex:'Mexicali', gdl:'Guadalajara', ver:'Veracruz',
  hgo:'Hidalgo', can:'Cancún', mer:'Mérida', qro:'Querétaro',
  cdmx:'Ciudad de México', vhs:'Villahermosa', admin:'Admin — Todas'
};
// Debe ser identica a SERVICE_TYPES de index.html (mismas etiquetas y mismo
// orden): es el vocabulario que comparten ordenes de compra y reparaciones
// para que al ligarlas cuadre la categoria. No hay JS compartido entre las
// paginas, asi que este espejo se mantiene a mano.
const TIPOS_SERVICIO = ['A/C','Compresor','Eléctrico','Frenos','Hojalatería y pintura','Llantas','Mangueras/Conexiones','Mecánica general','Motor','Muelles/Amortiguadores','Refacciones','Sistema de enfriamiento','Transmisión','Otro'];
// Sugerencias, no catálogo cerrado: el campo es texto libre (<datalist>) para
// no bloquear a un proveedor que cobre en un banco que no esté en la lista.
const BANCOS = ['Santander','BBVA','Banorte','Citibanamex','HSBC','Scotiabank',
  'Inbursa','Banco Azteca','BanCoppel','Banregio','Afirme','BanBajío','Mifel',
  'Multiva','Banco del Bienestar','Hey Banco','Nu','Klar','STP'];
const STATUS_LABELS = {pendiente:'Pendiente', autorizada:'Autorizada', pagada:'Pagada', rechazada:'Rechazada'};
const STATUS_PILL = {pendiente:'pill-mid', autorizada:'pill-blue', pagada:'pill-good', rechazada:'pill-worn'};

// ─── STATE ───────────────────────────────────────────────────────────────────
let sb = null;
let ST = {
  auth:null, role:null, authEmail:null, saving:false, loginErr:'',
  buses:[],
  toast:null, toastType:null,

  view:'form', // 'form' | 'receipt'
  // Una orden puede cubrir varias unidades. El monto se captura como total del
  // trabajo y se reparte entre las unidades seleccionadas, guardando un
  // renglon por unidad: el Taller reportea gasto POR unidad (columna Unidad,
  // filtro por unidad, CSV y el espejo a service_logs al marcar pagada), asi
  // que una sola fila con varias unidades romperia esa atribucion.
  // 'unidades' = la compra es para unidades concretas; 'stock' = todavia no se
  // sabe a que unidad va, se captura contra una ciudad y se asigna despues en
  // el Taller. Sin ciudad el RLS no podria ubicar la fila y quedaria invisible.
  ocDestino:'unidades', ocCity:'',
  ocBusIds:[], ocBusQuery:'',
  ocTipo:'', ocConcepto:'', ocProveedor:'', ocCuenta:'', ocBanco:'', ocMonto:'', ocSolicita:'',
  ocErr:'', ocLastOrders:null,

  // Memoria de proveedores: se deriva de purchase_orders, no hay tabla nueva.
  proveedores:[], ocProvMatches:[], ocProvKnown:null, ocCuentaAuto:false, ocBancoAuto:false
};

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init(){
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: window.sessionStorage, persistSession: true }
    });
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const role = session.user?.app_metadata?.role;
      const cities = session.user?.app_metadata?.cities;
      if(role && cities){
        ST.role = role; ST.auth = cities; ST.authEmail = session.user?.email || null;
        ST.ocSolicita = ST.authEmail || '';
        const {error}=await loadData(); if(error) console.error('Error cargando datos:', error);
      }
    }
  } catch(e){ console.error('Supabase unreachable:', e); }
  render();
}

// ─── DATA LAYER ──────────────────────────────────────────────────────────────
async function loadData(){
  const [r1,r2]=await Promise.all([
    sb.from('buses').select('*'),
    // Solo para la memoria de proveedores: nombre + ultima cuenta y banco.
    sb.from('purchase_orders')
      .select('proveedor,cuenta_referencia,banco,bus_id,created_at')
      .order('created_at',{ascending:false}).limit(1000),
  ]);
  if(r1.error) return {error:r1.error.message};
  ST.buses=r1.data||[];
  // Que falle el historial no debe impedir capturar una orden nueva.
  if(r2.error){ console.warn('Sin historial de proveedores:', r2.error.message); ST.proveedores=[]; }
  else buildProveedores(r2.data||[]);
  return {error:null};
}
// Un solo insert con las N filas: o entran todas o no entra ninguna, para que
// no quede media orden capturada si se cae la red a medio camino.
async function dbSaveOrders(orders){
  if(!sb) return {data:null,error:'Sin conexión'};
  const {data,error}=await sb.from('purchase_orders').insert(orders).select();
  return {data,error};
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mxn(n){ return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function authCities(){ return ST.auth==='all'?null:ST.auth.split(','); }
function cityBuses(){ const c=authCities(); return ST.buses.filter(b=>!c||c.includes(b.city)); }
// Las unidades se identifican por numero, no por texto. localeCompare ordenaba
// alfabeticamente: "141" caia antes que "22" y la "96" hasta despues de la
// "915", asi que el capturista no la encontraba y concluia que no estaba dada
// de alta. Ordenamos por el primer numero del nombre ("ECO 02" -> 2,
// "724 / 81" -> 724) y desempatamos con collation numerica.
function unitNum(name){ const m=String(name==null?'':name).match(/\d+/); return m?parseInt(m[0],10):Infinity; }
function cmpUnidad(a,b){ return (unitNum(a.name)-unitNum(b.name)) || String(a.name).localeCompare(String(b.name),'es',{numeric:true}); }

function fmtDateTime(iso){ return new Date(iso).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}); }

// ─── MEMORIA DE PROVEEDORES ──────────────────────────────────────────────────
// No hay tabla de proveedores: la fuente de verdad son las ordenes ya
// capturadas. De cada proveedor distinto guardamos su cuenta/referencia y su
// banco mas recientes, y cuantas ordenes lleva. Los proveedores usados en las ciudades del
// usuario van primero — un taller de Tijuana no le sirve a quien captura en
// Cancun.
function ocNorm(s){
  return (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
function buildProveedores(rows){
  const myBuses=new Set(cityBuses().map(b=>b.id));
  const map=new Map(); // rows viene ordenado desc: el primero es el mas reciente
  rows.forEach(o=>{
    const nombre=(o.proveedor||'').trim();
    const key=ocNorm(nombre);
    if(!key) return;
    let p=map.get(key);
    if(!p){ p={key, nombre, cuenta:null, banco:null, n:0, ultima:o.created_at, mia:false}; map.set(key,p); }
    p.n++;
    // rows viene en desc, asi que el primer valor no vacio es el mas reciente.
    if(!p.cuenta && (o.cuenta_referencia||'').trim()) p.cuenta=o.cuenta_referencia.trim();
    if(!p.banco && (o.banco||'').trim()) p.banco=o.banco.trim();
    if(myBuses.has(o.bus_id)) p.mia=true;
  });
  ST.proveedores=[...map.values()].sort((a,b)=>
    (b.mia-a.mia) || (b.n-a.n) || String(b.ultima).localeCompare(String(a.ultima)));
}
function ocFindProveedor(text){
  const k=ocNorm(text);
  return k ? (ST.proveedores.find(p=>p.key===k)||null) : null;
}
function ocMatchProveedores(text){
  const k=ocNorm(text);
  if(k.length<2) return [];
  return ST.proveedores
    .filter(p=>p.key!==k && p.key.includes(k))
    .sort((a,b)=>(b.key.startsWith(k)-a.key.startsWith(k)) || (b.mia-a.mia) || (b.n-a.n))
    .slice(0,6);
}
// Que el proveedor recien capturado ya sirva para la siguiente orden de la
// misma sesion, sin recargar la pagina.
function ocRememberProveedor(o){
  const nombre=((o&&o.proveedor)||'').trim();
  const key=ocNorm(nombre);
  if(!key) return;
  const cuenta=(o.cuenta_referencia||'').trim()||null;
  const banco=(o.banco||'').trim()||null;
  const p=ST.proveedores.find(x=>x.key===key);
  if(p){ p.n++; p.nombre=nombre; p.mia=true; p.ultima=o.created_at; if(cuenta) p.cuenta=cuenta; if(banco) p.banco=banco; }
  else ST.proveedores.unshift({key, nombre, cuenta, banco, n:1, ultima:o.created_at, mia:true});
}

// El input NO llama a render(): un render() completo reconstruiria el <input> y
// le quitaria el foco al usuario a media palabra (mismo patron que el
// autocomplete de operador en chequeo.html).
function ocProveedorInput(text){
  ST.ocProveedor=text;
  const exact=ocFindProveedor(text);
  ST.ocProvKnown=exact;
  ST.ocProvMatches=exact?[]:ocMatchProveedores(text);
  ocApplyProvDatos(exact);
  ocRefreshProvUI();
}
// Cuenta y banco se autocompletan igual: si el proveedor es conocido se
// rellenan desde su ultima orden; si el usuario cambia de proveedor, lo que
// habiamos puesto nosotros se limpia, pero lo que el escribio a mano se queda.
function ocApplyProvDatos(p){
  if(p&&p.cuenta) ocFillCuenta(p); else if(ST.ocCuentaAuto) ocClearCuenta();
  if(p&&p.banco) ocFillBanco(p); else if(ST.ocBancoAuto) ocClearBanco();
}
function ocPickProveedor(i){
  const p=ST.ocProvMatches[i];
  if(!p) return;
  ST.ocProveedor=p.nombre;
  ST.ocProvKnown=p;
  ST.ocProvMatches=[];
  const inp=document.getElementById('oc-proveedor');
  if(inp) inp.value=p.nombre;
  ocApplyProvDatos(p);
  ocRefreshProvUI();
  if(inp) inp.focus();
}
// La cuenta autocompletada queda marcada como "auto": si el usuario la escribe
// o la corrige a mano ya no la pisamos, y si cambia de proveedor se limpia.
function ocFillCuenta(p){
  if(!p.cuenta) return;
  if((ST.ocCuenta||'').trim() && !ST.ocCuentaAuto) return;
  ST.ocCuenta=p.cuenta; ST.ocCuentaAuto=true;
  const inp=document.getElementById('oc-cuenta');
  if(inp) inp.value=p.cuenta;
}
function ocClearCuenta(){
  ST.ocCuenta=''; ST.ocCuentaAuto=false;
  const inp=document.getElementById('oc-cuenta');
  if(inp) inp.value='';
  ocRefreshCuentaUI();
}
function ocCuentaInput(text){ ST.ocCuenta=text; ST.ocCuentaAuto=false; ocRefreshCuentaUI(); }
function ocFillBanco(p){
  if(!p.banco) return;
  if((ST.ocBanco||'').trim() && !ST.ocBancoAuto) return;
  ST.ocBanco=p.banco; ST.ocBancoAuto=true;
  const inp=document.getElementById('oc-banco');
  if(inp) inp.value=p.banco;
  ocRefreshBancoUI();
}
function ocClearBanco(){
  ST.ocBanco=''; ST.ocBancoAuto=false;
  const inp=document.getElementById('oc-banco');
  if(inp) inp.value='';
  ocRefreshBancoUI();
}
function ocBancoInput(text){ ST.ocBanco=text; ST.ocBancoAuto=false; ocRefreshBancoUI(); }
function ocRefreshProvUI(){
  const el=document.getElementById('oc-prov-sugg');
  if(el) el.innerHTML=renderProvSuggInner();
  ocRefreshCuentaUI(); ocRefreshBancoUI();
}
function ocRefreshCuentaUI(){
  const el=document.getElementById('oc-cuenta-hint');
  if(el) el.innerHTML=renderCuentaHintInner();
}
function ocRefreshBancoUI(){
  const el=document.getElementById('oc-banco-hint');
  if(el) el.innerHTML=renderBancoHintInner();
}
function renderProvSuggInner(){
  const p=ST.ocProvKnown;
  if(p){
    const ordenes=`${p.n} ${p.n===1?'orden previa':'órdenes previas'}`;
    const datos=[p.cuenta?`cuenta ${escHtml(p.cuenta)}`:'sin cuenta registrada',
                 p.banco?escHtml(p.banco):'sin banco registrado'].join(' · ');
    return `<div class="oc-ok">✓ Proveedor conocido · ${ordenes} · ${datos}</div>`;
  }
  if(ST.ocProvMatches.length){
    return `<div class="chq-op-sugg oc-prov-sugg">
      ${ST.ocProvMatches.map((m,i)=>`<div class="chq-op-sugg-item" onclick="ocPickProveedor(${i})">
        <div class="oc-sugg-nom">${escHtml(m.nombre)}</div>
        <div class="oc-sugg-sub">${m.cuenta?`Cuenta ${escHtml(m.cuenta)}`:'Sin cuenta registrada'}${m.banco?` · ${escHtml(m.banco)}`:''} · ${m.n} ${m.n===1?'orden':'órdenes'}</div>
      </div>`).join('')}
    </div>`;
  }
  if(ocNorm(ST.ocProveedor).length>=2){
    return `<div class="oc-sugg-sub" style="margin-top:4px">Proveedor nuevo — se guardará con esta orden.</div>`;
  }
  return '';
}
function renderCuentaHintInner(){
  if(ST.ocCuentaAuto && ST.ocProvKnown){
    return `Autocompletada de la última orden de ${escHtml(ST.ocProvKnown.nombre)} · <span class="lnk" onclick="ocClearCuenta()">borrar</span>`;
  }
  return '';
}
function renderBancoHintInner(){
  if(ST.ocBancoAuto && ST.ocProvKnown){
    return `Autocompletado de la última orden de ${escHtml(ST.ocProvKnown.nombre)} · <span class="lnk" onclick="ocClearBanco()">borrar</span>`;
  }
  return '';
}

// ─── SELECTOR DE UNIDADES ────────────────────────────────────────────────────
// Mismo patron que el autocomplete de proveedor: ni la busqueda ni los checks
// llaman a render(), porque un render() completo reconstruye el <input> y le
// quita el foco al usuario (y reinicia el scroll de la lista). Cada accion
// refresca solo el pedazo de DOM que cambio.
function ocVisibleBuses(){
  const q=ocNorm(ST.ocBusQuery);
  const all=cityBuses().slice().sort(cmpUnidad);
  if(!q) return all;
  return all.filter(b=>ocNorm(b.name).includes(q)||ocNorm(b.client).includes(q));
}
function ocBusQueryInput(text){ ST.ocBusQuery=text; ocRefreshUnitList(); }
// Las ciudades que el usuario puede capturar. Quien tiene una sola la trae ya
// elegida; 'admin' no es una ciudad real, se excluye.
function ocCityOptions(){
  const mias=authCities();
  return Object.keys(CITIES).filter(c=>c!=='admin'&&(!mias||mias.includes(c)));
}
function ocSetDestino(d){
  ST.ocDestino=d;
  if(d==='stock'){
    const opts=ocCityOptions();
    if(!ST.ocCity&&opts.length===1) ST.ocCity=opts[0];
  }
  ST.ocErr='';
  render();
}
function ocToggleBus(id,on){
  const i=ST.ocBusIds.indexOf(id);
  if(on&&i<0) ST.ocBusIds.push(id);
  if(!on&&i>=0) ST.ocBusIds.splice(i,1);
  // Quitar un chip tiene que destildar su casilla en la lista de abajo.
  const cb=document.querySelector('#oc-unit-list input[data-id="'+CSS.escape(id)+'"]');
  if(cb&&cb.checked!==on) cb.checked=on;
  ocRefreshUnitUI();
}
function ocSelectVisible(){
  ocVisibleBuses().forEach(b=>{ if(!ST.ocBusIds.includes(b.id)) ST.ocBusIds.push(b.id); });
  ocRefreshUnitList(); ocRefreshUnitUI();
}
function ocClearBuses(){ ST.ocBusIds=[]; ocRefreshUnitList(); ocRefreshUnitUI(); }
function ocRefreshUnitList(){
  const el=document.getElementById('oc-unit-list');
  if(el) el.innerHTML=renderUnitListInner();
  ocRefreshUnitBar();
}
function ocRefreshUnitBar(){
  const el=document.getElementById('oc-unit-bar');
  if(el) el.innerHTML=renderUnitBarInner();
}
function ocRefreshUnitUI(){
  const el=document.getElementById('oc-unit-chips');
  if(el) el.innerHTML=renderUnitChipsInner();
  ocRefreshUnitBar();
  ocRefreshSplit();
}
function ocSelectedBuses(){
  const byId=new Map(ST.buses.map(b=>[b.id,b]));
  return ST.ocBusIds.map(id=>byId.get(id)).filter(Boolean).sort(cmpUnidad);
}
function renderUnitListInner(){
  const vis=ocVisibleBuses();
  if(!vis.length) return `<div class="oc-unit-none">Ninguna unidad coincide con “${escHtml(ST.ocBusQuery)}”</div>`;
  const sel=new Set(ST.ocBusIds);
  // data-id + this.dataset.id en vez de interpolar el id en el onchange: hay
  // unidades con espacios y diagonales ("724 / 81") que romperian el literal.
  return vis.map(b=>`<label class="oc-unit-row">
    <input type="checkbox" data-id="${escHtml(b.id)}"${sel.has(b.id)?' checked':''} onchange="ocToggleBus(this.dataset.id,this.checked)">
    <span class="oc-unit-nom">${escHtml(b.name)}</span>
    <span class="oc-unit-sub">${escHtml(b.client||'')}</span>
  </label>`).join('');
}
function renderUnitChipsInner(){
  return ocSelectedBuses().map(b=>`<span class="oc-chip">${escHtml(b.name)}<span class="x" data-id="${escHtml(b.id)}" onclick="ocToggleBus(this.dataset.id,false)" title="Quitar">×</span></span>`).join('');
}
function renderUnitBarInner(){
  const n=ST.ocBusIds.length, total=cityBuses().length, vis=ocVisibleBuses();
  const pend=vis.filter(b=>!ST.ocBusIds.includes(b.id)).length;
  const left=n?`${n} de ${total} seleccionada${n===1?'':'s'}`:`${total} unidades · ninguna seleccionada`;
  let acts=[];
  if(pend&&vis.length<total) acts.push(`<span class="lnk" onclick="ocSelectVisible()">Seleccionar las ${pend} visibles</span>`);
  if(n) acts.push(`<span class="lnk" onclick="ocClearBuses()">Limpiar</span>`);
  return `<span style="flex:1">${left}</span>${acts.join(' · ')}`;
}

// ─── REPARTO DEL MONTO ───────────────────────────────────────────────────────
// El monto capturado es el TOTAL del trabajo y se reparte entre las unidades.
// Se reparte en centavos para que la suma de los renglones de exactamente el
// total: el sobrante del redondeo se carga de a un centavo a las primeras.
function ocSplit(totalCents,n){
  const base=Math.floor(totalCents/n), r=totalCents-base*n;
  return Array.from({length:n},(_,i)=>(base+(i<r?1:0))/100);
}
function ocMontoInput(v){ ST.ocMonto=v; ocRefreshSplit(); }
function ocRefreshSplit(){
  const el=document.getElementById('oc-split');
  if(el) el.innerHTML=renderSplitInner();
}
function renderSplitInner(){
  if(ST.ocDestino==='stock') return '';
  const n=ST.ocBusIds.length;
  const total=parseFloat(ST.ocMonto);
  if(n<2||!isFinite(total)||total<=0) return '';
  const parts=ocSplit(Math.round(total*100),n);
  const max=parts[0], min=parts[parts.length-1];
  const det=(max===min)?`${mxn(min)} cada una`:`${mxn(max)} / ${mxn(min)}`;
  return `Se repartirá entre ${n} unidades: ${det} · se guarda un renglón por unidad.`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('root').innerHTML = ST.auth ? renderApp() : renderLogin();
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  if(ST.toast){ const t=document.createElement('div'); t.className='toast'+(ST.toastType==='error'?' error':''); t.textContent=ST.toast; document.body.appendChild(t); }
}
function showToast(msg,type='success'){ ST.toast=msg; ST.toastType=type; render(); setTimeout(()=>{ ST.toast=null; ST.toastType=null; document.querySelectorAll('.toast').forEach(e=>e.remove()); },2500); }

function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
    <div style="margin-bottom:1.75rem">
      <h1>Orden de Compra</h1>
      <p class="sub">Grupo ATE · Ingresa con tu correo y contraseña</p>
    </div>
    <div class="form-row"><label>Correo electrónico</label>
      <input type="email" id="login-email" placeholder="correo@autobusesate.com" autocomplete="username" autofocus>
    </div>
    <div class="form-row"><label>Contraseña</label>
      <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="err">${ST.loginErr}</div>
    <button class="btn primary full" onclick="doLogin()" style="margin-top:4px" ${ST.saving?'disabled':''}>
      ${ST.saving?'<span class="spinner"></span>Verificando...':'Entrar'}
    </button>
  </div></div>`;
}
async function doLogin(){
  const email=(document.getElementById('login-email')?.value||'').trim();
  const pw=document.getElementById('login-pw')?.value||'';
  if(!email||!pw) return;
  ST.saving=true; ST.loginErr=''; render();
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){ ST.loginErr='Correo o contraseña incorrectos'; ST.saving=false; render(); return; }
  const role=data.user?.app_metadata?.role;
  const cities=data.user?.app_metadata?.cities;
  if(!role||!cities){ ST.loginErr='Usuario sin rol o ciudad asignada. Contacta al administrador.'; ST.saving=false; render(); return; }
  ST.role=role; ST.auth=cities; ST.authEmail=data.user?.email||null; ST.ocSolicita=ST.authEmail||''; ST.saving=false;
  const {error:loadErr}=await loadData();
  if(loadErr){ ST.loginErr='Error al cargar datos. Intenta de nuevo.'; ST.auth=null; ST.role=null; ST.saving=false; render(); return; }
  render();
}
async function doLogout(){
  await sb.auth.signOut();
  ST.auth=null; ST.role=null; ST.authEmail=null; ST.buses=[];
  ST.view='form'; resetForm(); ST.ocLastOrders=null;
  render();
}

function renderApp(){
  let h=`<div class="oc-hdr">
    <h1>Orden de Compra</h1>
    ${ST.auth!=='all'?`<span class="city-badge">${ST.auth.split(',').map(c=>CITIES[c]).filter(Boolean).join(' · ')}</span>`:''}
    <button class="btn sm ghost" onclick="doLogout()">Salir</button>
  </div>`;
  h += ST.view==='receipt' ? renderReceipt() : renderForm();
  return h;
}

function resetForm(){
  ST.ocDestino='unidades'; ST.ocCity='';
  ST.ocBusIds=[]; ST.ocBusQuery=''; ST.ocTipo=''; ST.ocConcepto=''; ST.ocProveedor=''; ST.ocCuenta=''; ST.ocBanco='';
  ST.ocMonto=''; ST.ocSolicita=ST.authEmail||''; ST.ocErr='';
  ST.ocProvMatches=[]; ST.ocProvKnown=null; ST.ocCuentaAuto=false; ST.ocBancoAuto=false;
}

function renderForm(){
  return `<div class="card">
    <div class="form-row"><label>¿Para qué es la compra? *</label>
      <div class="oc-dest">
        <button type="button" class="oc-dest-btn${ST.ocDestino==='unidades'?' on':''}" onclick="ocSetDestino('unidades')">Para unidades</button>
        <button type="button" class="oc-dest-btn${ST.ocDestino==='stock'?' on':''}" onclick="ocSetDestino('stock')">Para stock</button>
      </div>
    </div>
    ${ST.ocDestino==='stock'?`
    <div class="form-row"><label>Ciudad *</label>
      <select id="oc-city" onchange="ST.ocCity=this.value">
        <option value="">— Selecciona ciudad —</option>
        ${ocCityOptions().map(c=>`<option value="${c}"${ST.ocCity===c?' selected':''}>${escHtml(CITIES[c]||c)}</option>`).join('')}
      </select>
      <div class="oc-hint">Se queda pendiente de asignar a unidades en Taller, después de pagarse.</div>
    </div>`:`
    <div class="form-row"><label>Unidades *</label>
      <input type="text" id="oc-unidad-q" placeholder="Buscar por número o cliente" value="${escHtml(ST.ocBusQuery)}" oninput="ocBusQueryInput(this.value)" autocomplete="off">
      <div class="oc-unit-box">
        <div class="oc-unit-list" id="oc-unit-list">${renderUnitListInner()}</div>
        <div class="oc-unit-bar" id="oc-unit-bar">${renderUnitBarInner()}</div>
      </div>
      <div class="oc-chips" id="oc-unit-chips">${renderUnitChipsInner()}</div>
    </div>`}
    <div class="form-row"><label>Tipo de servicio *</label>
      <select id="oc-tipo" onchange="ST.ocTipo=this.value">
        <option value="">— Selecciona tipo —</option>
        ${TIPOS_SERVICIO.map(t=>`<option value="${t}"${ST.ocTipo===t?' selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-row"><label>Concepto *</label>
      <textarea id="oc-concepto" rows="3" placeholder="¿Qué se va a hacer o comprar?" oninput="ST.ocConcepto=this.value">${escHtml(ST.ocConcepto)}</textarea>
    </div>
    <div class="form-row"><label>Proveedor *</label>
      <input type="text" id="oc-proveedor" placeholder="Nombre del proveedor o taller" value="${escHtml(ST.ocProveedor)}" oninput="ocProveedorInput(this.value)" autocomplete="off">
      <div id="oc-prov-sugg">${renderProvSuggInner()}</div>
    </div>
    <div class="form-row"><label>Cuenta / referencia *</label>
      <input type="text" id="oc-cuenta" placeholder="CLABE, cuenta o referencia de pago" value="${escHtml(ST.ocCuenta)}" oninput="ocCuentaInput(this.value)">
      <div class="oc-hint" id="oc-cuenta-hint">${renderCuentaHintInner()}</div>
    </div>
    <div class="form-row"><label>Banco *</label>
      <input type="text" id="oc-banco" list="oc-bancos" placeholder="Santander, BBVA, Banorte…" value="${escHtml(ST.ocBanco)}" oninput="ocBancoInput(this.value)" autocomplete="off">
      <datalist id="oc-bancos">${BANCOS.map(b=>`<option value="${escHtml(b)}"></option>`).join('')}</datalist>
      <div class="oc-hint" id="oc-banco-hint">${renderBancoHintInner()}</div>
    </div>
    <div class="form-row"><label>Monto total (MXN) *</label>
      <input type="number" id="oc-monto" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${escHtml(ST.ocMonto)}" oninput="ocMontoInput(this.value)">
      <div class="oc-split" id="oc-split">${renderSplitInner()}</div>
    </div>
    <div class="form-row"><label>Solicita *</label>
      <input type="text" id="oc-solicita" placeholder="Quién solicita la compra" value="${escHtml(ST.ocSolicita)}" oninput="ST.ocSolicita=this.value">
    </div>
    <div class="err">${ST.ocErr}</div>
    <button class="btn primary full" onclick="doSaveOrder()" ${ST.saving?'disabled':''}>
      ${ST.saving?'<span class="spinner"></span>Guardando...':'Generar orden'}
    </button>
  </div>`;
}

async function doSaveOrder(){
  if(ST.saving) return;
  const busIds=ST.ocBusIds.slice();
  const tipo=document.getElementById('oc-tipo')?.value||'';
  const concepto=(document.getElementById('oc-concepto')?.value||'').trim();
  const proveedor=(document.getElementById('oc-proveedor')?.value||'').trim();
  const cuenta=(document.getElementById('oc-cuenta')?.value||'').trim();
  const banco=(document.getElementById('oc-banco')?.value||'').trim();
  const montoRaw=document.getElementById('oc-monto')?.value||'';
  const solicita=(document.getElementById('oc-solicita')?.value||'').trim();
  const monto=parseFloat(montoRaw);

  const esStock=ST.ocDestino==='stock';
  if(esStock && !ST.ocCity){ ST.ocErr='Selecciona la ciudad de la compra.'; render(); return; }
  if(!esStock && !busIds.length){ ST.ocErr='Selecciona al menos una unidad.'; render(); return; }
  if(!tipo){ ST.ocErr='Selecciona el tipo de servicio.'; render(); return; }
  if(!concepto){ ST.ocErr='El concepto es obligatorio.'; render(); return; }
  if(!proveedor){ ST.ocErr='El proveedor es obligatorio.'; render(); return; }
  if(!cuenta){ ST.ocErr='La cuenta / referencia es obligatoria.'; render(); return; }
  if(!banco){ ST.ocErr='El banco es obligatorio.'; render(); return; }
  if(!montoRaw||isNaN(monto)||monto<=0){ ST.ocErr='Ingresa un monto válido.'; render(); return; }
  if(!solicita){ ST.ocErr='El campo "Solicita" es obligatorio.'; render(); return; }
  ST.ocErr='';

  // Una compra a stock es un solo renglón sin unidad: el reparto ocurre después,
  // al asignarla en el Taller.
  if(esStock){
    const orders=[{
      bus_id:null, city:ST.ocCity, stock_estado:'pendiente',
      tipo_servicio:tipo, concepto, proveedor,
      cuenta_referencia:cuenta||null, banco:banco||null,
      monto:Math.round(monto*100)/100, solicita
    }];
    ST.saving=true; render();
    const {data,error}=await dbSaveOrders(orders);
    ST.saving=false;
    if(error){ ST.ocErr='Error al guardar. Intenta de nuevo.'; render(); return; }
    ST.ocLastOrders=data||[];
    ocRememberProveedor(ST.ocLastOrders[0]);
    ST.view='receipt'; render();
    return;
  }

  // Un renglon por unidad, con el total repartido en centavos. El orden de las
  // unidades es el numerico ascendente, no el orden en que se fueron marcando,
  // para que el recibo se lea igual que la lista.
  const chosen=ocSelectedBuses();
  const parts=ocSplit(Math.round(monto*100), chosen.length);
  const orders=chosen.map((b,i)=>({
    bus_id:b.id, tipo_servicio:tipo, concepto, proveedor,
    cuenta_referencia:cuenta||null, banco:banco||null, monto:parts[i],
    solicita
  }));
  ST.saving=true; render();
  const {data,error}=await dbSaveOrders(orders);
  ST.saving=false;
  if(error){ ST.ocErr='Error al guardar. Intenta de nuevo.'; render(); return; }
  ST.ocLastOrders=(data||[]).slice().sort((a,b)=>a.folio_num-b.folio_num);
  ocRememberProveedor(ST.ocLastOrders[0]);
  ST.view='receipt';
  render();
}

function renderReceipt(){
  const orders=ST.ocLastOrders;
  if(!orders||!orders.length){ ST.view='form'; return renderForm(); }
  const o=orders[0];
  const n=orders.length;
  const byId=new Map(ST.buses.map(b=>[b.id,b]));
  const nombre=id=>byId.get(id)?.name||id||'—';
  const total=orders.reduce((t,x)=>t+Number(x.monto||0),0);
  // Los folios son consecutivos porque salen de la misma identity en un solo
  // insert; si por concurrencia no lo fueran, no inventamos un rango falso.
  const seguidos=n>1 && (orders[n-1].folio_num-o.folio_num===n-1);
  const folioHdr=n===1?escHtml(o.folio)
    :seguidos?`${escHtml(o.folio)} – ${escHtml(orders[n-1].folio)}`
    :`${n} folios`;
  const canImage=!!window.htmlToImage;
  const canCopy=canImage && !!(navigator.clipboard && window.ClipboardItem);

  let h=`<div id="oc-receipt-card" class="oc-receipt">
    <div class="oc-receipt-hdr">
      <div class="brand">Grupo ATE — Orden de Compra</div>
      <div class="folio">${folioHdr}</div>
      <div class="sub">${fmtDateTime(o.created_at)}</div>
    </div>
    ${o.bus_id?`<div class="oc-receipt-row"><span class="lbl">${n===1?'Unidad':`Unidades (${n})`}</span><span class="val">${escHtml(orders.map(x=>nombre(x.bus_id)).join(', '))}</span></div>`
      :`<div class="oc-receipt-row"><span class="lbl">Destino</span><span class="val">Stock · ${escHtml(CITIES[o.city]||o.city||'—')}</span></div>`}
    <div class="oc-receipt-row"><span class="lbl">Tipo de servicio</span><span class="val">${escHtml(o.tipo_servicio)}</span></div>
    <div class="oc-receipt-row"><span class="lbl">Proveedor</span><span class="val">${escHtml(o.proveedor)}</span></div>
    ${o.banco?`<div class="oc-receipt-row"><span class="lbl">Banco</span><span class="val">${escHtml(o.banco)}</span></div>`:''}
    ${o.cuenta_referencia?`<div class="oc-receipt-row"><span class="lbl">Cuenta / referencia</span><span class="val">${escHtml(o.cuenta_referencia)}</span></div>`:''}
    <div class="oc-receipt-concepto">${escHtml(o.concepto)}</div>
    ${n>1?`<div class="oc-receipt-split">
      <div class="hd">Reparto por unidad</div>
      ${orders.map(x=>`<div class="it"><span class="u">${escHtml(nombre(x.bus_id))}</span><span class="f">${escHtml(x.folio)}</span><span>${mxn(x.monto)}</span></div>`).join('')}
    </div>`:''}
    <div class="oc-receipt-monto">
      <div class="amt">${mxn(total)}</div>
      <div class="lbl">${n===1?'Monto MXN':`Monto total MXN · ${n} unidades`}</div>
    </div>
    <div class="oc-receipt-row"><span class="lbl">Solicita</span><span class="val">${escHtml(o.solicita)}</span></div>
    <div class="oc-receipt-row"><span class="lbl">Status</span><span class="val"><span class="oc-receipt-status ${STATUS_PILL[o.status]||'pill-mid'}">${STATUS_LABELS[o.status]||o.status}</span></span></div>
    <div class="oc-receipt-ft">Envía esta captura al grupo de WhatsApp para autorización${
      !o.bus_id?`<br>Compra a stock · se asigna a unidades en Taller, después de pagarse`
      :n>1?`<br>Cada unidad se autoriza por separado en Taller`:''}</div>
  </div>`;

  h+=`<div class="oc-actions">
    ${canImage?`<button class="btn primary" onclick="doDownloadImage()">↓ Descargar imagen</button>`:''}
    ${canCopy?`<button class="btn" onclick="doCopyImage()">Copiar imagen</button>`:''}
    <button class="btn ghost" onclick="ST.view='form';resetForm();render()">+ Nueva orden</button>
  </div>`;
  return h;
}

// La tarjeta se centra con margin:0 auto; html-to-image copia ese margen
// calculado al clon y lo desplaza dentro de un lienzo del tamano de la tarjeta,
// asi que la imagen salia cortada. Se anula el margen y se fija el tamano.
function receiptImageOpts(node){
  return {pixelRatio:2, backgroundColor:'#ffffff',
    width:node.offsetWidth, height:node.offsetHeight,
    style:{margin:'0'}};
}
async function doDownloadImage(){
  const node=document.getElementById('oc-receipt-card');
  if(!node||!window.htmlToImage) return;
  try{
    const dataUrl=await htmlToImage.toPng(node,receiptImageOpts(node));
    const a=document.createElement('a');
    a.href=dataUrl; a.download=`${ST.ocLastOrders[0].folio}.png`; a.click();
  }catch(e){ showToast('No se pudo generar la imagen. Toma una captura de pantalla.','error'); }
}
async function doCopyImage(){
  const node=document.getElementById('oc-receipt-card');
  if(!node||!window.htmlToImage) return;
  try{
    const blob=await htmlToImage.toBlob(node,receiptImageOpts(node));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    showToast('Imagen copiada');
  }catch(e){ showToast('No se pudo copiar. Usa Descargar imagen.','error'); }
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!ST.auth){ doLogin(); } });

init();
</script>
