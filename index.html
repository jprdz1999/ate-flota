<style>
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:1.25rem}
.bus-chip{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;cursor:pointer;transition:border-color 0.12s}
.bus-chip:hover{border-color:var(--border2)}
.bus-chip.active{border-color:var(--blue);background:var(--blue-bg)}
.bus-chip .cn{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.bus-chip .cm{font-size:11px;color:var(--text2);line-height:1.5}
.bus-chip.active .cn{color:var(--blue-dark)}
.chip-add{border-style:dashed;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text3);font-size:13px;min-height:64px;cursor:pointer}
.chip-add:hover{color:var(--text2);border-color:var(--border2)}
.alert-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;display:inline-block}
.tab-row{display:flex;gap:4px;margin-bottom:1rem;border-bottom:0.5px solid var(--border);padding-bottom:0.75rem;flex-wrap:wrap}
.tab{padding:6px 15px;font-size:13px;border:0.5px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer;font-weight:500}
.tab.active{background:var(--bg2);color:var(--text);border-color:var(--border)}
.tab:hover:not(.active){background:var(--bg2)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media(max-width:680px){.two-col{grid-template-columns:1fr}}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.kpi{background:var(--bg2);border-radius:var(--radius);padding:10px 12px}
.kpi .kl{font-size:11px;color:var(--text2);margin-bottom:3px}
.kpi .kv{font-size:20px;font-weight:600;line-height:1;color:var(--text)}
.kpi .ks{font-size:11px;color:var(--text3);margin-top:3px}
.kpi .kv.warn{color:var(--amber-dark)}.kpi .kv.alert{color:var(--red-dark)}
.log-item{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border);align-items:start}
.log-item:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.d-oil{background:var(--green)}.d-repair{background:var(--red)}.d-km{background:var(--blue)}
.li-title{font-size:13px;font-weight:500;margin-bottom:2px;color:var(--text)}
.li-meta{font-size:11px;color:var(--text2)}
.li-cost{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.li-cost.zero{font-weight:400;color:var(--text3);font-size:12px}
.alert-bar{background:var(--amber-bg);border:0.5px solid var(--amber);border-radius:var(--radius);padding:9px 13px;font-size:12px;color:var(--amber-dark);margin-bottom:1rem;line-height:1.6}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.stat-row:last-of-type{border-bottom:none}
.stat-lbl{font-size:12px;color:var(--text2)}
.tire-wrap{max-width:230px;margin:0 auto 0.75rem}
.tp-btn{cursor:pointer}.tp-btn:hover rect{opacity:0.8}
.hist-entry{font-size:12px;padding:5px 0;border-bottom:0.5px solid var(--border);color:var(--text2);line-height:1.5}
.hist-entry:last-child{border-bottom:none}
.hist-entry b{color:var(--text);font-weight:500}
.bar-wrap{margin-bottom:12px}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--text)}
.bar-track{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.rpt-filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:1.25rem}
@media(max-width:680px){.rpt-filters{grid-template-columns:1fr 1fr}}
.rpt-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
@media(max-width:680px){.rpt-kpi-row{grid-template-columns:repeat(2,1fr)}}
.rpt-table{width:100%;border-collapse:collapse;font-size:13px}
.rpt-table th{text-align:left;font-size:11px;font-weight:600;color:var(--text2);padding:0 10px 8px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:0.5px solid var(--border2);white-space:nowrap}
.rpt-table td{padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:top}
.rpt-table tbody tr:last-child td{border-bottom:none}
.rpt-table tbody tr:hover td{background:var(--bg2)}
.svc-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;display:inline-block}
.cb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:2px}
.cb-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer;user-select:none}
.cb-item input[type=checkbox]{width:15px;height:15px;flex-shrink:0;accent-color:var(--blue);cursor:pointer}
.alert-bar.red{background:var(--red-bg);border-color:var(--red);color:var(--red-dark)}
.alert-bar.green{background:var(--green-bg);border-color:var(--green);color:var(--green-dark)}
.status-bar{display:flex;gap:5px;margin:3px 0 2px;align-items:center}
.ind{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.ind-green{background:var(--green)}.ind-yellow{background:var(--amber)}.ind-red{background:var(--red)}
.ind-gray{background:var(--text3)}.ind-white{background:var(--bg);border:0.5px solid var(--border2)}
.cl-section{background:var(--bg2);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
.cl-sec-hdr{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px}
.cl-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--border);gap:12px;font-size:13px}
.cl-item:last-child{border-bottom:none}
.cl-item-lbl{flex:1;color:var(--text);line-height:1.4}
.cl-tg{display:flex;gap:3px;flex-shrink:0}
.cl-btn{padding:3px 10px;font-size:12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text2);cursor:pointer;font-weight:600;min-width:34px;text-align:center}
.cl-btn:hover{background:var(--bg3)}
.cl-btn.ok{background:var(--green-bg);color:var(--green-dark);border-color:var(--green)}
.cl-btn.bad{background:var(--red-bg);color:var(--red-dark);border-color:var(--red)}
.cl-btn.na{background:var(--bg3);color:var(--text3);border-color:var(--border)}
.cl-hist-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.cl-hist-item:last-child{border-bottom:none}
.issue-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.issue-item:last-child{border-bottom:none}

/* ═══════════════════════════════════════════════════════════════════════════
   REDISEÑO — Sistema visual (mockup ate-flota-rediseno.html). Override local:
   solo aplica a index.html; shared.css intacto para chequeo/orden-compra.
   Tipografías: se cargan vía <link> en <head> (no @import, que debe ir primero).
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#141618;--bg2:#1D2023;--bg3:#25292D;
  --surface:#1D2023;--surface-2:#25292D;--line:#31363B;
  --text:#E9ECEE;--text2:#8A9298;--text3:#5E666C;
  --border:#2A2E32;--border2:#3A4046;
  --accent:#F2B01E;--accent-ink:#241C05;
  --ok:#3FB950;--warn:#D9A21B;--bad:#E5484D;--none:#5E666C;
  --blue:#4C8DE0;--blue-dark:#3A6FB0;--blue-bg:#12283f;
  --green:#3FB950;--green-dark:#5CD16C;--green-bg:rgba(63,185,80,.13);
  --amber:#D9A21B;--amber-dark:#E5B84B;--amber-bg:rgba(217,162,27,.13);
  --red:#E5484D;--red-dark:#FF8085;--red-bg:rgba(229,72,77,.14);
  --radius:9px;--radius-lg:12px;
}
body{background:#0C0E10;font-family:Inter,system-ui,sans-serif;color:var(--text)}
.num{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:480px;padding:0 0 96px}
@media(min-width:900px){.wrap{max-width:1100px;padding:0 1rem 96px}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#ffbe2e;border-color:#ffbe2e}

/* Barra superior de la app */
.appbar{position:sticky;top:0;z-index:30;background:rgba(20,22,24,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.appbar-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.brand span{color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:15px;flex:0 0 auto}
.iconbtn:active{background:var(--surface-2)}

/* Header pegajoso de unidad / acción */
.uhead{position:sticky;top:0;z-index:30;background:rgba(20,22,24,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.uhead-top{display:flex;align-items:center;gap:12px;padding:11px 14px 10px}
.uback{background:none;border:0;color:var(--text);font-size:24px;cursor:pointer;padding:0 4px;line-height:1;min-width:44px;min-height:44px;display:grid;place-items:center}
.ubig{font-family:"Roboto Mono",monospace;font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1}
.uttl{font-size:15.5px;font-weight:700}
.umeta{font-size:11.5px;color:var(--text2);margin-top:3px;letter-spacing:.01em}
.uodo{text-align:right;line-height:1.15;flex:0 0 auto}
.uodo b{font-family:"Roboto Mono",monospace;font-size:17px;font-weight:600;display:block}
.uodo span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.utabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.utabs::-webkit-scrollbar{display:none}
.utab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--text2);padding:11px 12px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px}
.utab.on{color:var(--text);border-bottom-color:var(--accent)}

/* Barra de guardar pegajosa inferior */
.stickybar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(20,22,24,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:40}
@media(min-width:900px){.stickybar{max-width:none;left:auto;right:auto;position:sticky}}
.btn-primary-lg{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}
.btn-primary-lg:disabled{opacity:.6;cursor:default}
.btn-ghost-lg{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:14px;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:8px;min-height:48px}

/* Tarjetas y badges del rediseño */
.pad{padding:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.rcard.act{cursor:pointer}.rcard.act:active{background:var(--surface-2)}
.grouphead{display:flex;align-items:baseline;gap:8px;padding:16px 2px 8px;font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--text2)}
.grouphead b{color:var(--text3);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.badge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-bad{background:var(--red-bg);color:var(--red-dark)}
.b-warn{background:var(--amber-bg);color:var(--amber-dark)}
.b-ok{background:var(--green-bg);color:var(--green-dark)}
.b-none{background:rgba(138,146,152,.13);color:var(--text2)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}.kv span{color:var(--text2)}.kv b{font-weight:600}

/* Skeleton de carga */
.skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:skel 1.2s ease-in-out infinite;border-radius:8px}
@keyframes skel{to{background-position:-200% 0}}
.skel-row{height:64px;margin:1px 0}
.odo-big{width:100%;font-family:"Roboto Mono",monospace;font-size:30px;font-weight:600;text-align:center;letter-spacing:.02em;padding:15px;border:1.5px solid var(--accent);border-radius:11px;background:var(--surface);color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.odo-hint{font-size:12px;color:var(--text3);margin-top:7px;text-align:center}
.odo-field{margin-bottom:18px}
.odo-field label{display:block;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.odo-field .req{color:var(--accent);font-weight:700}
.only-desktop{display:none}
@media(min-width:900px){.only-mobile{display:none}.only-desktop{display:block}}

/* ── Home por prioridad (Fase 5) ── */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:46px;margin-bottom:12px}
.search input{background:none;border:0;outline:none;color:var(--text);font-size:15px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--text3)}
.chips{display:flex;gap:7px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--text);color:#121417;border-color:var(--text);font-weight:600}
.rows{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;color:inherit;font-family:inherit;border-left:0;border-right:0;border-bottom:0}
.frow:active{background:var(--surface)}
.frow:last-child{border-bottom:1px solid var(--line)}
.frow .unit{width:56px;flex:0 0 auto;font-family:"Roboto Mono",monospace;font-size:19px;font-weight:700;letter-spacing:-.03em}
.frow .rowmid{flex:1;min-width:0}
.frow .rowsub{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.frow .km{font-family:"Roboto Mono",monospace;font-size:12.5px;color:var(--text3)}
.frow .chev{color:var(--text3);font-size:16px;flex:0 0 auto}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,22,24,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:900px){.tabbar{max-width:none}}
.tabbar button{background:none;border:0;color:var(--text3);padding:9px 0 11px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit;letter-spacing:.02em}
.tabbar button i{font-size:16px;font-style:normal;line-height:1}
.tabbar button.on{color:var(--accent)}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:900px){.menu-overlay{align-items:center}}
.menu-sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:480px;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:900px){.menu-sheet{border-radius:14px}}
.menu-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:15px 6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none}
.menu-item:last-child{border-bottom:0}
</style>
</head>

// Zonas rectangulares (% del viewBox del diagrama, vista de planta/desde arriba
// de un camión: el frente queda a la izquierda del dibujo (x bajo), la trasera
// a la derecha (x alto), el costado de arriba es lateral_izq y el de abajo es
// lateral_der) usadas solo para clasificar un pin {x,y} en una de las 6 zonas
// para el buscador "última foto sin X". No cubren el 100% del rectángulo a
// propósito (el centro del cuerpo no pertenece a ninguna zona de foto) —
// puntos ahí simplemente no clasifican (chqZoneFor regresa null).
const CHQ_ZONES = [
  {id:'frontal',      x:0,  y:0,  w:14, h:100},
  {id:'trasera',      x:86, y:0,  w:14, h:100},
  {id:'parabrisas',   x:14, y:30, w:16, h:40},
  {id:'llantas',      x:70, y:30, w:16, h:40},
  {id:'lateral_izq',  x:14, y:0,  w:72, h:30},
  {id:'lateral_der',  x:14, y:70, w:72, h:30},
];
function chqZoneFor(pt){
  const z=CHQ_ZONES.find(z=>pt.x>=z.x&&pt.x<=z.x+z.w&&pt.y>=z.y&&pt.y<=z.y+z.h);
  return z?z.id:null;
}

async function init(){
  // Red de seguridad: QRs generados antes de que el chequeo rápido se separara
  // a su propia página (chequeo.html) todavía apuntan aquí con ?unidad=.
  // Redirigimos de inmediato en vez de cargar toda la app de flota.
  const qsUnidad = new URLSearchParams(location.search).get('unidad');
  if(qsUnidad){ location.replace('chequeo.html?unidad='+encodeURIComponent(qsUnidad)); return; }
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: window.sessionStorage, persistSession: true }
    });
    const { data:{ session } } = await sb.auth.getSession();
    if(session){
      const role = session.user?.app_metadata?.role;
      const cities = session.user?.app_metadata?.cities;
      if(role && cities){
        ST.role = role; ST.auth = cities; ST.authEmail = session.user?.email || null;
        const {error}=await loadFromSupabase(); if(error) console.error('Error cargando datos:', error);
        const {error:chqErr}=await loadChequeosData(); if(chqErr) console.error('Error cargando chequeos:', chqErr);
        const {error:ocErr}=await loadComprasData(); if(ocErr) console.error('Error cargando órdenes de compra:', ocErr);
      }
    }
  } catch(e){ console.error('Supabase unreachable:', e); }
  render();
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Math.round(n).toLocaleString('es-MX'); }
function mxn(n){ return '$'+Math.round(n).toLocaleString('es-MX'); }
function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function authCities(){ return ST.auth==='all'?null:ST.auth.split(','); }
function adminFilterCities(){ return ST.auth==='all'?Object.keys(CITIES).filter(k=>k!=='admin'):ST.auth.split(','); }
function cityBuses(){ const c=authCities(); return ST.buses.filter(b=>!c||c.includes(b.city)); }
function busLogs(id){ return ST.logs.filter(l=>(l.bus_id||l.busId)===id).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0)); }
function tireKM(tire,km){ return Math.max(0,km-(tire.kmAt||0)); }
function condFill(c){ return c==='good'?'#639922':c==='mid'?'#EF9F27':c==='worn'?'#E24B4A':'#B4B2A9'; }
function condPill(c){ return c==='good'?'pill-good':c==='mid'?'pill-mid':c==='worn'?'pill-worn':'pill-empty'; }
function condLabel(c){ return c==='good'?'Buena':c==='mid'?'Desgaste medio':c==='worn'?'Desgaste alto':'Sin datos'; }

function oilInterval(bus){ return bus.oil_interval||(bus.type==='bus'?30000:10000); }

function applicableServices(bus){
  const svcs=[
    {type:'svc',      label:'Aceite de motor',       interval:oilInterval(bus)},
    {type:'svc_trans',label:'Aceite de transmisión', interval:60000},
  ];
  if(bus.type!=='urvan') svcs.push({type:'svc_diff',label:'Aceite diferencial',interval:60000});
  return svcs;
}

function getServiceAlertFor(bus, svcType, interval){
  const logs=busLogs(bus.id).filter(l=>l.type===svcType);
  if(!logs.length) return {status:'none',lastLog:null,remaining:0,overdueBy:0,km:0};
  const last=logs[0];
  const kmSince=bus.km-(last.km_after||0);
  if(kmSince>=interval) return {status:'overdue',km:kmSince,overdueBy:kmSince-interval,remaining:0,lastLog:last};
  return {status:'ok',km:kmSince,remaining:interval-kmSince,lastLog:last};
}

function getServiceAlert(bus){
  return getServiceAlertFor(bus,'svc',oilInterval(bus));
}

function getAlerts(bus){
  const alerts=[], logs=busLogs(bus.id);
  const interval=oilInterval(bus);
  const warn=Math.round(interval*0.9);
  const lastOil=logs.find(l=>l.type==='svc'||l.type==='oil');
  if(!lastOil) alerts.push('Sin aceite registrado');
  else { const km=bus.km-(lastOil.km_after||lastOil.kmAfter||0); if(km>=interval) alerts.push(`Aceite: ${fmt(km)} km`); else if(km>=warn) alerts.push(`Aceite próximo: ${fmt(km)} km`); }
  Object.entries(bus.tires||{}).forEach(([pos,t])=>{ if(!t) return; const km=tireKM(t,bus.km); if(km>=70000) alerts.push(`${POS_NAMES[pos]}: ${fmt(km)} km`); });
  return alerts;
}

function getSubtipo(log){
  if(log.type==='repair'){
    const parts=(log.description||'').split(' · ');
    return parts.length>1?parts[0]:'—';
  }
  const labels={oil:'Aceite / Preventivo',repair:'Correctivo',km:'Solo KM',tire:'Llanta',svc:'Aceite de motor',svc_trans:'Aceite de transmisión',svc_diff:'Aceite diferencial'};
  return labels[log.type]||log.type||'—';
}

function parseChecklist(log){
  try{ return JSON.parse((log.description||'').slice(6)); }catch(e){ return null; }
}
function getChecklistFailures(data){
  const f=[];
  Object.entries(data.docs||{}).forEach(([k,v])=>{ if(v===false) f.push(k); });
  Object.entries(data.carroceria||{}).forEach(([k,v])=>{ if(v==='M') f.push(k); });
  Object.entries(data.llantas||{}).forEach(([k,v])=>{ if(v==='M') f.push(k); });
  Object.entries(data.niveles||{}).forEach(([k,v])=>{ if(v==='M') f.push(k); });
  return f;
}
function getFleetIndicators(bus){
  const svcAl=getServiceAlert(bus);
  let oil,oilTip;
  if(svcAl.status==='none'){ oil='red'; oilTip='Sin registro de aceite'; }
  else if(svcAl.status==='overdue'){ oil='red'; oilTip=`Vencido ${fmt(svcAl.overdueBy)} km`; }
  else if(svcAl.remaining<=1000){ oil='yellow'; oilTip=`${fmt(svcAl.remaining)} km al próximo cambio`; }
  else { oil='green'; oilTip=`${fmt(svcAl.remaining)} km al próximo cambio`; }
  const clLogs=busLogs(bus.id).filter(l=>l.type==='checklist');
  let tire,tireTip;
  if(!clLogs.length){ tire='gray'; tireTip='Sin inspección registrada'; }
  else {
    const last=clLogs[0];
    const data=parseChecklist(last);
    const days=Math.floor((Date.now()-new Date(last.date+'T12:00:00').getTime())/86400000);
    const hasBadTire=data&&Object.values(data.llantas||{}).some(v=>v==='M');
    if(hasBadTire){ tire='red'; tireTip='Llanta en mal estado'; }
    else if(days>7){ tire='yellow'; tireTip=`Inspección hace ${days} días`; }
    else { tire='green'; tireTip=`Insp. hace ${days} día${days===1?'':'s'}`; }
  }
  const open=(bus.open_issues||[]).filter(i=>!i.resolved);
  return {oil,oilTip,tire,tireTip,issues:open.length?'red':'white',issuesTip:open.length?`${open.length} pendiente(s)`:'Sin pendientes'};
}

function applyReportFilters(){
  const allowed=new Set(cityBuses().map(b=>b.id));
  let rows=ST.logs.filter(l=>allowed.has(l.bus_id||l.busId));
  if(ST.rptBus!=='all') rows=rows.filter(l=>(l.bus_id||l.busId)===ST.rptBus);
  if(ST.rptType!=='all') rows=rows.filter(l=>l.type===ST.rptType);
  if(ST.rptFrom) rows=rows.filter(l=>l.date>=ST.rptFrom);
  if(ST.rptTo)   rows=rows.filter(l=>l.date<=ST.rptTo);
  return rows.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
}

async function doLogin(){
  const email=(document.getElementById('login-email')?.value||'').trim();
  const pw=document.getElementById('login-pw')?.value||'';
  if(!email||!pw) return;
  ST.saving=true; ST.loginErr=''; render();
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){ ST.loginErr='Correo o contraseña incorrectos'; ST.saving=false; render(); return; }
  const role=data.user?.app_metadata?.role;
  const cities=data.user?.app_metadata?.cities;
  if(!role||!cities){ ST.loginErr='Usuario sin rol o ciudad asignada. Contacta al administrador.'; ST.saving=false; render(); return; }
  ST.role=role; ST.auth=cities; ST.authEmail=data.user?.email||null; ST.saving=false;
  const {error:loadErr}=await loadFromSupabase();
  if(loadErr){ ST.loginErr='Error al cargar datos. Intenta de nuevo.'; ST.auth=null; ST.role=null; ST.saving=false; render(); return; }
  const {error:chqErr}=await loadChequeosData();
  if(chqErr) console.error('Error cargando chequeos:', chqErr);
  render();
}

// Estado accionable de una unidad: grupo de severidad + badge de texto + motivo.
function unitStatus(bus){
  const nuevos=activeDanos(bus.id).filter(d=>d.fecha_deteccion===today());
  const seg=activeDanos(bus.id).filter(d=>d.severidad==='seguridad');
  if(nuevos.length||seg.length){ const d=nuevos[0]||seg[0]; return {group:'atencion', badge:'Golpe nuevo', cls:'b-bad', reason:d.descripcion||'Detectado en inspección'}; }
  if(!bus.km) return {group:'sindatos', badge:'Sin datos', cls:'b-none', reason:'Sin kilometraje — captúralo en un chequeo'};
  let overdue=null, soon=null;
  applicableServices(bus).forEach(svc=>{ const al=getServiceAlertFor(bus,svc.type,svc.interval);
    if(al.status==='overdue'){ if(!overdue||al.overdueBy>overdue.by) overdue={label:svc.label,by:al.overdueBy}; }
    else if(al.status==='ok' && al.remaining<=Math.max(1000,Math.round(svc.interval*0.1))){ if(!soon||al.remaining<soon.rem) soon={label:svc.label,rem:al.remaining}; }
  });
  if(overdue) return {group:'atencion', badge:'Servicio vencido', cls:'b-bad', reason:`${overdue.label} · ${fmt(overdue.by)} km pasados`};
  let tireBad=null;
  Object.entries(bus.tires||{}).forEach(([pos,t])=>{ if(t){ const km=tireKM(t,bus.km); if(km>=70000 && (!tireBad||km>tireBad.km)) tireBad={pos,km}; } });
  if(tireBad) return {group:'atencion', badge:'Llanta baja', cls:'b-warn', reason:`${POS_NAMES[tireBad.pos]||tireBad.pos} · ${fmt(tireBad.km)} km`};
  if(soon) return {group:'vencer', badge:`Servicio en ${fmt(soon.rem)} km`, cls:'b-warn', reason:soon.label};
  if(bus.client==='Pasaje'){
    const hoy=ST.chequeos.some(c=>c.bus_id===bus.id && c.fecha===today());
    if(!hoy){ const last=ST.chequeos.filter(c=>c.bus_id===bus.id).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]; return {group:'vencer', badge:'Sin chequeo hoy', cls:'b-warn', reason:last?`Último: ${last.fecha}`:'Sin chequeos registrados'}; }
  }
  const al0=getServiceAlert(bus);
  return {group:'aldia', badge:'Al día', cls:'b-ok', reason:al0.lastLog?`Próximo servicio en ${fmt(al0.remaining)} km`:'Sin alertas'};
}

  // Acción primaria (según línea) + acceso a golpes.

  const alerts=resumenAlerts(bus);

    alerts.forEach(a=>{
      const open = a.href ? `navigate('${a.href}')` : (a.js||'');
      h+=`<div class="rcard act" onclick="${open}"><div class="empty">
        <div><div style="font-weight:600;font-size:14.5px">${a.title}</div>

      </div></div>`;
    });
  }

  // Ficha (identidad).
  const tipo=bus.type==='bus'?'Autobús':bus.type==='txl'?'TXL':'Urvan / Sprinter';
  h+=`<div class="grouphead" style="padding-left:2px">Ficha</div>

      <div class="kv"><span>Tipo</span><b>${tipo}</b></div>

    </div>`;

    h+=`<button class="btn-ghost-lg" onclick="ST.modal='chqQr';ST.chqQrBusId='${bus.id}';render()">QR de chequeo</button>`;

  }

// Deriva las alertas accionables del Resumen (odómetro, aceite, pendientes).
function resumenAlerts(bus){
  const uid_=encodeURIComponent(bus.id);
  const esPasaje=bus.client==='Pasaje';
  const out=[];
  // Golpe nuevo -> alerta (la función de mayor valor: detectar daño nuevo).
  const nuevosHoy=activeDanos(bus.id).filter(d=>d.fecha_deteccion===today());
  if(nuevosHoy.length){
    const seg=nuevosHoy.some(d=>d.severidad==='seguridad');
    out.push({title:`${nuevosHoy.length} golpe(s) nuevo(s) hoy`, desc:seg?'Incluye severidad de seguridad.':'Detectado en inspección.', cta:'Ver', solid:true, href:`/unidad/${uid_}/golpes`});
  }
  if(!bus.km){
    out.push({title:'Sin odómetro registrado', desc:'Nada se puede calcular hasta capturarlo.',
      cta:'Capturar', solid:true,
      js: esPasaje ? `window.open('/chequeo.html?unidad=${uid_}','_blank')` : `navigate('/unidad/${uid_}/checklist-nuevo')`});
  }
  applicableServices(bus).forEach(svc=>{
    const al=getServiceAlertFor(bus,svc.type,svc.interval);
    const tipoSlug={svc:'motor',svc_trans:'transmision',svc_diff:'diferencial'}[svc.type];
    if(al.status==='none') out.push({title:`${svc.label} sin registro`, desc:'Registra el último cambio para arrancar el ciclo.', cta:'Registrar', href:`/unidad/${uid_}/aceite/${tipoSlug}`});
    else if(al.status==='overdue') out.push({title:`${svc.label} vencido`, desc:`${fmt(al.overdueBy)} km pasados.`, cta:'Registrar', solid:true, href:`/unidad/${uid_}/aceite/${tipoSlug}`});
    else if(al.remaining<=1000) out.push({title:`${svc.label} por vencer`, desc:`Faltan ${fmt(al.remaining)} km.`, cta:'Registrar', href:`/unidad/${uid_}/aceite/${tipoSlug}`});
  });
  Object.entries(bus.tires||{}).forEach(([pos,t])=>{ if(t && tireKM(t,bus.km)>=70000) out.push({title:`Llanta ${POS_NAMES[pos]||pos}`, desc:`${fmt(tireKM(t,bus.km))} km recorridos.`, cta:'Ver', href:`/unidad/${uid_}/mantenimiento`}); });
  const pend=(bus.open_issues||[]).filter(i=>!i.resolved).length;
  if(pend) out.push({title:`${pend} acción(es) pendiente(s)`, desc:'Reportadas en inspección.', cta:'Ver', href:`/unidad/${uid_}/inspecciones`});
  return out;
}

function renderTireDetailCard(bus,sel){
  const tire=(bus.tires||{})[sel];
  let h=`<div class="rcard"><div class="cardhead" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${POS_NAMES[sel]||sel}</b><button class="btn sm ghost" onclick="ST.selTire=null;render()">Cerrar ✕</button></div>`;

    h+=`<p style="font-size:13px;color:var(--text2);margin:0 0 10px">Sin llanta registrada en esta posición.</p>
      <button class="btn-primary-lg" onclick="openTireAt('${sel}')">Instalar llanta aquí</button>`;
  } else {
    const km=tireKM(tire,bus.km);
    h+=`<div class="kv"><span>Estado</span><b>${condLabel(tire.cond)}</b></div>
      <div class="kv"><span>Marca / Medida</span><b>${tire.brand||'—'}</b></div>

      <div class="kv"><span>KM recorridos</span><b class="num" style="color:${km>=70000?'var(--bad)':km>=50000?'var(--warn)':'var(--ok)'}">${fmt(km)}</b></div>

// ─── GOLPES: expediente acumulado por unidad ─────────────────────────────────
function renderDanosDiagram(danos){
  const W=400,H=170;
  let h=`<div style="background:var(--surface-2);border-radius:12px;padding:12px 8px;margin-bottom:12px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    <text x="57" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text3)" font-family="-apple-system,sans-serif">FRENTE</text>
    <text x="343" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text3)" font-family="-apple-system,sans-serif">TRASERA</text>
    <rect x="25" y="35" width="355" height="100" rx="26" fill="var(--surface)" stroke="var(--border2)" stroke-width="1.5"/>
    <rect x="34" y="43" width="36" height="84" fill="var(--bg2)"/>
    ${[100,133,166,199,232,265,298,331].map(x=>`<rect x="${x}" y="43" width="24" height="17" rx="3" fill="var(--bg2)"/><rect x="${x}" y="110" width="24" height="17" rx="3" fill="var(--bg2)"/>`).join('')}`;
  danos.forEach((d,i)=>{
    const cx=Number(d.x)/100*W, cy=Number(d.y)/100*H;
    const fill=d.severidad==='seguridad'?'var(--bad)':'var(--warn)';
    h+=`<g><circle cx="${cx}" cy="${cy}" r="9" fill="${fill}" stroke="var(--bg)" stroke-width="1.5"/>
      <text x="${cx}" y="${cy+3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="#241C05" font-family="Roboto Mono">${i+1}</text></g>`;
  });
  h+=`</svg></div>`;
  return h;
}
function danoRow(d, num){
  const nuevoHoy = d.estado==='activo' && d.fecha_deteccion===today();
  const sevPill = d.severidad==='seguridad'?'b-bad':'b-warn';
  const baseNom = id => (ST.bases.find(b=>b.id===id)?.nombre)||id||'—';
  const hhmm = ts => ts?new Date(Number(ts)).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—';
  const origen = d.origen==='checklist'?'checklist':'chequeo rápido';
  const attr = `${d.fecha_deteccion} · ${origen}${d.base_id?' base '+escHtml(baseNom(d.base_id)):''}${d.operador_texto?' · Op. '+escHtml(d.operador_texto):''}`;
  const ventana = (d.prev_ts && d.detectado_ts)
    ? `Apareció entre ${escHtml(baseNom(d.prev_base_id))} (${hhmm(d.prev_ts)}) y ${escHtml(baseNom(d.base_id))} (${hhmm(d.detectado_ts)}).` : '';
  const dn = num!=null
    ? `<div style="width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto;font-family:'Roboto Mono';margin-top:2px;background:${d.severidad==='seguridad'?'var(--bad)':'var(--warn)'};color:#241C05">${num}</div>`
    : `<div style="width:22px;flex:0 0 auto"></div>`;
  return `<div style="display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)">${dn}<div style="flex:1;min-width:0">
    <div style="font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap">${escHtml(d.descripcion)}
      <span class="badge ${sevPill}">${d.severidad==='seguridad'?'Seguridad':'Cosmético'}</span>
      ${nuevoHoy?`<span class="badge b-bad">Nuevo</span>`:''}
      ${d.estado==='reparado'?`<span class="badge b-ok">Reparado</span>`:''}</div>
    <p style="margin:3px 0 0;font-size:11.5px;color:var(--text3)">${attr}</p>
    ${ventana?`<p style="margin:4px 0 0;font-size:11.5px;color:var(--text2)">${ventana}</p>`:''}
    ${d.estado==='reparado'&&d.reparado_fecha?`<p style="margin:3px 0 0;font-size:11.5px;color:var(--text3)">Reparado ${d.reparado_fecha}${d.reparado_nota?' · '+escHtml(d.reparado_nota):''}</p>`:''}
    ${d.estado==='activo'?`<button class="btn sm" style="margin-top:7px" onclick="doMarcarReparado('${d.id}')">Marcar reparado ✓</button>`:''}
  </div></div>`;
}
function renderGolpes(bus){
  const uid_=encodeURIComponent(bus.id);
  const activos=activeDanos(bus.id);
  const reparados=busDanos(bus.id).filter(d=>d.estado==='reparado');
  const nuevoHoy=activos.filter(d=>d.fecha_deteccion===today()).length;
  let h=uheadUnit(bus,{title:'Estado de golpes', backTo:'/unidad/'+uid_, odo:false});
  h+=`<div class="pad" style="padding-bottom:40px">`;
  h+=`<div class="rcard" style="border-left:2px solid var(--accent);font-size:12.5px;color:var(--text2);line-height:1.5">Este es el <b style="color:var(--accent)">expediente acumulado</b> de la unidad, no la foto de un chequeo. Cada inspección se compara contra este estado — así "golpe nuevo" significa algo.</div>`;
  if(!activos.length && !reparados.length){
    h+=`<div class="rcard"><div class="empty"><p style="margin:0;color:var(--text2)">Sin golpes registrados en esta unidad.</p></div></div></div>`;
    return h;
  }
  if(activos.length) h+=renderDanosDiagram(activos);
  h+=`<div class="grouphead" style="padding-left:2px">Activos <b>${activos.length}</b>${nuevoHoy?` · ${nuevoHoy} nuevo(s) hoy`:''}</div>`;
  h+=`<div class="rcard" style="padding:4px 14px">${activos.length?activos.map((d,i)=>danoRow(d,i+1)).join(''):`<p style="color:var(--text2);font-size:13px;padding:8px 0;margin:0">Ninguno activo.</p>`}</div>`;
  if(reparados.length){
    h+=`<div class="grouphead" style="padding-left:2px">Reparados <b>${reparados.length}</b></div>`;
    h+=`<div class="rcard" style="padding:4px 14px">${reparados.map(d=>danoRow(d,null)).join('')}</div>`;
  }
  h+=`</div>`;
  return h;
}
async function doMarcarReparado(id){
  const d=ST.danos.find(x=>x.id===id);
  if(!d||d.estado!=='activo') return;
  if(!confirm('¿Marcar este golpe como reparado?')) return;
  const prevEstado=d.estado, prevFecha=d.reparado_fecha;
  d.estado='reparado'; d.reparado_fecha=today();
  render();
  const {error}=await dbUpdateDano(id,{estado:'reparado', reparado_fecha:today()});
  if(error){ d.estado=prevEstado; d.reparado_fecha=prevFecha; showToast('Error al actualizar. Intenta de nuevo.','error'); render(); }
  else showToast('Golpe marcado como reparado');
}

// Cada acción es su propia pantalla: header pegajoso arriba, formulario, y la
// barra de guardar SIEMPRE pegajosa abajo (nunca al final del scroll).
function renderActionScreen(bus){
  const uid_=encodeURIComponent(bus.id);
  const A=ST.action;
  if(A==='golpes') return renderGolpes(bus);   // pantalla de consulta, sin barra de guardar
  let title='', body='', save='', backTo='/unidad/'+uid_;
  if(A==='aceite'){
    const svcType=ACEITE_SLUGS[ST.actionParam]||'svc';
    const labels={svc:'Aceite de motor',svc_trans:'Aceite de transmisión',svc_diff:'Aceite diferencial'};
    const pfx={svc:'e',svc_trans:'t',svc_diff:'d'}[svcType];
    title=labels[svcType]||'Aceite'; backTo='/unidad/'+uid_+'/servicio';
    body=aceiteBody(bus,svcType,pfx);
    save=`doSaveServiceLog('${bus.id}','${svcType}','${pfx}')`;
  } else if(A==='reparacion'){
    title='Registrar reparación'; backTo='/unidad/'+uid_+'/reparaciones';
    body=reparacionBody(bus); save=`doSaveRepairLog('${bus.id}')`;
  } else if(A==='registro'){
    title='Nuevo registro'; backTo='/unidad/'+uid_+'/historial';
    body=registroBody(bus); save=`doSaveLog('${bus.id}')`;
  } else if(A==='checklist-nuevo'){
    title='Nueva inspección'; backTo='/unidad/'+uid_+'/checklist';
    body=checklistBody(bus); save=`doSaveChecklist('${bus.id}')`;
  } else {
    title='Próximamente';
    body=`<div class="rcard"><p style="color:var(--text2);margin:0">Esta acción se construye en una fase posterior del rediseño.</p></div>`;
  }
  let h=uheadUnit(bus,{title,backTo});
  h+=`<div class="pad" style="padding-bottom:100px">`;
  if(ST.modalErr) h+=`<div class="modal-err">${ST.modalErr}</div>`;
  h+=body+`</div>`;
  if(save){
    h+=`<div class="stickybar"><button class="btn-primary-lg" onclick="${save}" ${ST.saving?'disabled':''}>
      ${ST.saving?'<span class="spinner"></span>Guardando…':'Guardar'}</button></div>`;
  }
  return h;
}

  const isAdmin=ST.role==='admin';

  const rows=applyReportFilters();
  const totalCost=rows.reduce((s,l)=>s+(l.cost||0),0);
  const uniqBuses=new Set(rows.map(l=>l.bus_id||l.busId)).size;
  const typeColors={oil:'var(--green)',repair:'var(--red)',km:'var(--blue)',tire:'var(--amber)'};

  let h=`<div class="card">

  const oilInt=oilInterval(bus), oilWarn=Math.round(oilInt*0.9);

  const isAdmin=ST.role==='admin';

  let h=`<div class="tire-wrap"><svg viewBox="0 0 240 305" style="width:100%;display:block">
    <rect x="33" y="25" width="174" height="232" rx="10" fill="var(--bg2)" stroke="var(--border)" stroke-width="0.5"/>
    <rect x="51" y="36" width="138" height="46" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="0.5"/>

    <text x="120" y="300" text-anchor="middle" font-size="8" fill="var(--text3)" font-family="-apple-system,sans-serif">TRASERA</text>`;
  positions.forEach(p=>{

    const lines=p.lbl.split('\n'), cx=p.x+p.w/2, cy=p.y+p.h/2;
    const click=interactive?`onclick="ST.selTire='${p.id}';render()"`:''
    h+=`<g class="${interactive?'tp-btn':''}" ${click}>

    if(p.spare){
      h+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="7" fill="white" font-family="-apple-system,sans-serif" font-weight="600">REF</text>
          <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.85)" font-family="-apple-system,sans-serif">${t?fmt(km)+'k':'—'}</text>`;
    } else {
      lines.forEach((ln,i)=>{ h+=`<text x="${cx}" y="${cy-(lines.length-1)*4.5+i*9-3}" text-anchor="middle" font-size="7" fill="white" font-family="-apple-system,sans-serif" font-weight="600">${ln}</text>`; });
      h+=`<text x="${cx}" y="${p.y+p.h-4}" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.85)" font-family="-apple-system,sans-serif">${t?fmt(km)+'k':'—'}</text>`;
    }
    h+=`</g>`;
  });
  h+=`</svg></div>`;
  h+=`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-top:0.5rem">
    ${[['#639922','Buena'],['#EF9F27','Medio'],['#E24B4A','Alto desgaste'],['#B4B2A9','Sin datos']].map(([c,l])=>
      `<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:${c};flex-shrink:0;display:inline-block"></span>${l}</span>`).join('')}
  </div>`;
  return h;
}

// ─── MINI-CHEQUEOS: DIAGRAMA DE DAÑO ─────────────────────────────────────────
// Vista de planta (desde arriba) de un camión: frente a la izquierda (x bajo),
// trasera a la derecha (x alto), costado de arriba = lateral_izq, costado de
// abajo = lateral_der. Debe quedar en sync con CHQ_ZONES si se ajustan las
// proporciones.
// La captura (tap interactivo para agregar marcas) vive solo en chequeo.html.
// Aquí el diagrama siempre se dibuja en modo lectura, sobre un timeline o la
// vista de detalle de un chequeo ya guardado.
const CHQ_DIAGRAM_W=400, CHQ_DIAGRAM_H=170;
function renderChqDiagram(prevPins, pins){
  prevPins=prevPins||[]; pins=pins||[];
  let h=`<div class="chq-diagram-wrap"><svg viewBox="0 0 ${CHQ_DIAGRAM_W} ${CHQ_DIAGRAM_H}" style="width:100%;display:block">
    <rect x="0" y="0" width="${CHQ_DIAGRAM_W}" height="${CHQ_DIAGRAM_H}" fill="var(--bg3)"/>
    <text x="57" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text3)" font-family="-apple-system,sans-serif">FRENTE</text>
    <text x="343" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text3)" font-family="-apple-system,sans-serif">TRASERA</text>
    <rect x="70" y="27" width="26" height="9" rx="3" fill="var(--text3)"/>
    <rect x="304" y="27" width="26" height="9" rx="3" fill="var(--text3)"/>
    <rect x="70" y="134" width="26" height="9" rx="3" fill="var(--text3)"/>
    <rect x="304" y="134" width="26" height="9" rx="3" fill="var(--text3)"/>
    <rect x="25" y="35" width="355" height="100" rx="26" fill="var(--bg)" stroke="var(--border2)" stroke-width="1.5"/>
    <rect x="18" y="43" width="10" height="7" rx="2" fill="var(--border2)"/>
    <rect x="18" y="120" width="10" height="7" rx="2" fill="var(--border2)"/>
    <rect x="34" y="43" width="36" height="84" fill="var(--bg2)"/>
    ${[100,133,166,199,232,265,298,331].map(x=>`<rect x="${x}" y="43" width="24" height="17" rx="3" fill="var(--bg2)"/><rect x="${x}" y="110" width="24" height="17" rx="3" fill="var(--bg2)"/>`).join('')}
    <rect x="120" y="127" width="4" height="8" fill="var(--border2)"/>
  `;
  prevPins.forEach(p=>{
    const cx=p.x/100*CHQ_DIAGRAM_W, cy=p.y/100*CHQ_DIAGRAM_H;
    h+=`<g class="chq-pin locked"><title>${escHtml(p.descripcion)} (previo)</title>
      <circle cx="${cx}" cy="${cy}" r="7" fill="var(--text3)" opacity="0.6" stroke="var(--bg)" stroke-width="1.5"/>
    </g>`;
  });
  pins.forEach(p=>{
    const cx=p.x/100*CHQ_DIAGRAM_W, cy=p.y/100*CHQ_DIAGRAM_H;
    const fill=p.severidad==='seguridad'?'var(--red)':'var(--amber)';
    h+=`<g class="chq-pin locked"><title>${escHtml(p.descripcion)}</title>
      <circle cx="${cx}" cy="${cy}" r="8" fill="${fill}" stroke="var(--bg)" stroke-width="1.5"/>
    </g>`;
  });
  h+=`</svg></div>`;
  h+=`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-top:0.5rem">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--text3);opacity:0.6;flex-shrink:0;display:inline-block"></span>Daño ya reportado</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--amber);flex-shrink:0;display:inline-block"></span>Nuevo · Cosmético</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--red);flex-shrink:0;display:inline-block"></span>Nuevo · Seguridad</span>
  </div>`;
  return h;
}

// Escape hatch fuera del ciclo de render(): las URLs firmadas son async y
// render() construye el HTML de forma síncrona (mismo patrón puntual que
// clToggle usa para tocar el DOM directo fuera del re-render normal).
async function hydratePhotos(mapping){
  await Promise.all(Object.entries(mapping||{}).map(async ([domId,path])=>{
    if(!path) return;
    const url=await getSignedPhotoUrl(path);
    const el=document.getElementById(domId);
    if(el && url) el.src=url;
  }));
}

}

    list.forEach(c=>{

function chqToggleTimeline(id){

    const c=ST.chequeos.find(x=>x.id===id);
    if(c) hydratePhotos(Object.fromEntries(CHQ_SLOTS.map(s=>[`chq-tl-photo-${c.id}-${s}`, c.fotos?.[s]])));
  }
}
function renderChqDetail(c){
  const prev=c.chequeo_anterior_id?ST.chequeos.find(x=>x.id===c.chequeo_anterior_id):null;

  const curBase=ST.bases.find(b=>b.id===c.base_id);

    .sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.ts||0)-(a.ts||0));

async function doAttendAlert(id){
  const c=ST.chequeos.find(x=>x.id===id);
  if(!c||c.alerta_atendida) return;
  c.alerta_atendida=true;
  render();
  const {error}=await dbAttendAlerta(id);
  if(error){ c.alerta_atendida=false; showToast('Error al actualizar. Intenta de nuevo.','error'); render(); }
  else showToast('Alerta atendida');
}

function chqZoneHasDamage(chq, zona){
  return (chq.marcas_acumuladas||[]).some(p=>chqZoneFor(p)===zona);
}
function renderChqZonaSearch(){
  let h=`<div class="card" style="margin-bottom:10px"><div class="fg2">
    <div class="form-row" style="margin:0"><label>Zona</label>
      <select onchange="ST.chqZonaSel=this.value||null;render()">
        <option value="">— Selecciona zona —</option>
        ${CHQ_SLOTS.map(s=>`<option value="${s}"${ST.chqZonaSel===s?' selected':''}>${CHQ_SLOT_LABELS[s]}</option>`).join('')}
      </select></div>
    <div class="form-row" style="margin:0"><label>Unidad</label>
      <select onchange="ST.chqZonaBusId=this.value;render()">
        <option value="all">Todas las unidades</option>
        ${ST.buses.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>`<option value="${b.id}"${ST.chqZonaBusId===b.id?' selected':''}>${b.name}</option>`).join('')}
      </select></div>
  </div></div>`;
  if(!ST.chqZonaSel) return h+`<div class="empty-state">Selecciona una zona para buscar</div>`;
  const buses=ST.chqZonaBusId==='all'?ST.buses:ST.buses.filter(b=>b.id===ST.chqZonaBusId);
  let any=false;
  buses.forEach(b=>{
    const list=busChequeos(b.id).slice().reverse(); // orden cronológico ascendente
    if(!list.length) return;
    any=true;
    let lastClean=null;
    list.forEach(c=>{ if(!chqZoneHasDamage(c,ST.chqZonaSel)) lastClean=c; });
    const hasDamageNow=chqZoneHasDamage(list[list.length-1],ST.chqZonaSel);
    h+=`<div class="card" style="margin-bottom:8px">
      <div style="font-weight:600;font-size:13px;margin-bottom:4px">${b.name}</div>

function applyComprasFilters(){
  const allowed=new Set(cityBuses().map(b=>b.id));
  let rows=ST.ordenes.filter(o=>allowed.has(o.bus_id));
  if(ST.pcBus!=='all')    rows=rows.filter(o=>o.bus_id===ST.pcBus);
  if(ST.pcTipo!=='all')   rows=rows.filter(o=>o.tipo_servicio===ST.pcTipo);
  if(ST.pcStatus!=='all') rows=rows.filter(o=>o.status===ST.pcStatus);
  if(ST.pcFrom) rows=rows.filter(o=>o.created_at.slice(0,10)>=ST.pcFrom);
  if(ST.pcTo)   rows=rows.filter(o=>o.created_at.slice(0,10)<=ST.pcTo);
  return rows.sort((a,b)=>b.created_at.localeCompare(a.created_at));
}
async function doChangeOrdenStatus(id,status){
  const o=ST.ordenes.find(x=>x.id===id);
  if(!o||o.status===status) return;
  const prev=o.status;
  o.status=status; render();
  const {error}=await dbUpdateOrdenStatus(id,status);
  if(error){ o.status=prev; showToast('Error al actualizar. Intenta de nuevo.','error'); render(); }
  else showToast('Status actualizado');
}

function exportComprasCSV(){
  const rows=applyComprasFilters();
  if(!rows.length) return;
  const headers=['Folio','Fecha','Unidad','Tipo de servicio','Proveedor','Cuenta/Referencia','Monto','Solicita','Base','Status'];
  const lines=[headers.join(',')];
  rows.forEach(o=>{
    const bus=ST.buses.find(b=>b.id===o.bus_id);
    const base=ST.bases.find(b=>b.id===o.base_id);
    const cells=[
      o.folio,
      o.created_at.slice(0,10),
      `"${(bus?.name||'').replace(/"/g,'""')}"`,
      `"${o.tipo_servicio.replace(/"/g,'""')}"`,
      `"${(o.proveedor||'').replace(/"/g,'""')}"`,
      `"${(o.cuenta_referencia||'').replace(/"/g,'""')}"`,
      o.monto,
      `"${(o.solicita||'').replace(/"/g,'""')}"`,
      `"${(base?.nombre||'').replace(/"/g,'""')}"`,
      OC_STATUS_LABELS[o.status]||o.status
    ];
    lines.push(cells.join(','));
  });
  const blob=new Blob([String.fromCharCode(0xFEFF)+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`ordenes_compra_ate_${today()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function renderStats(bus){
  const logs=busLogs(bus.id);
  const byType={};
  logs.forEach(l=>{ byType[l.type]=(byType[l.type]||0)+(l.cost||0); });
  const total=Object.values(byType).reduce((a,b)=>a+b,0);
  const oilLogs=logs.filter(l=>l.type==='oil');
  let intervals=[];
  for(let i=0;i<oilLogs.length-1;i++){
    const d=(oilLogs[i].km_after||oilLogs[i].kmAfter||0)-(oilLogs[i+1].km_after||oilLogs[i+1].kmAfter||0);
    if(d>0) intervals.push(d);
  }
  const avgOil=intervals.length?Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length):null;
  const catColors={oil:'#639922',repair:'#E24B4A',km:'#378ADD'};
  const catNames={oil:'Aceite / Preventivo',repair:'Correctivos',km:'Solo KM'};

  let h=`<div class="two-col"><div>
  <div class="card"><h4 style="margin-bottom:1rem">Gasto por categoría</h4>
    ${Object.entries(catNames).map(([k,label])=>{
      const val=byType[k]||0, pct=total>0?Math.round(val/total*100):0;
      return `<div class="bar-wrap"><div class="bar-lbl"><span>${label}</span><span style="font-weight:600">${mxn(val)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${catColors[k]}"></div></div></div>`;
    }).join('')}

      <span>Total</span><span>${mxn(total)}</span>
    </div></div>
  ${oilLogs.length?`<div class="card">
    <h4 style="margin-bottom:0.75rem">Patrón de aceite</h4>
    <div class="stat-row"><span class="stat-lbl">Cambios registrados</span><span>${oilLogs.length}</span></div>
    ${avgOil?`<div class="stat-row"><span class="stat-lbl">Promedio entre cambios</span><span>${fmt(avgOil)} km</span></div>`:''}
    <div class="stat-row"><span class="stat-lbl">Último cambio</span><span>${oilLogs[0].date}</span></div>
    <div class="stat-row"><span class="stat-lbl">Próximo estimado</span>
      <span>${fmt((oilLogs[0].km_after||oilLogs[0].kmAfter||0)+5000)} km</span></div>
  </div>`:''}
  </div><div><div class="card">
    <h4 style="margin-bottom:0.75rem">Estado de llantas</h4>

        </div></div>`;
    }).join('')}
  </div></div></div>`;
  return h;

    else if(al.status==='overdue'){ badge=`<span class="badge b-bad"><i class="bdot"></i>Vencido</span>`; barPct=100; barColor='var(--bad)'; }
    else { const pct=Math.round(al.km/svc.interval*100); barPct=Math.min(100,pct);
      if(al.remaining<=1000){ badge=`<span class="badge b-warn"><i class="bdot"></i>Por vencer</span>`; barColor='var(--warn)'; }
      else { badge=`<span class="badge b-ok"><i class="bdot"></i>Al día</span>`; } }
    h+=`<div class="rcard">
      <div class="cardhead" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="ctitle" style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text2)">${svc.label}</div>${badge}</div>`;
    if(al.status==='none'){
      h+=`<div class="empty" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <p style="margin:0;color:var(--text2);font-size:13px">Sin ciclo activo. Registra el último cambio.</p>
        <button class="mini" style="border:1px solid var(--accent);color:var(--accent);background:none;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px" onclick="navigate('/unidad/${uid_}/aceite/${tipoSlug[svc.type]}')">Registrar</button>
      </div>`;
    } else {
      const rem=al.status==='overdue'?('−'+fmt(al.overdueBy)):fmt(al.remaining);
      h+=`<div class="big" style="font-family:'Roboto Mono',monospace;font-size:22px;font-weight:600">${rem} <span style="font-size:12px;color:var(--text2);font-family:Inter">km ${al.status==='overdue'?'de retraso':'restantes'}</span></div>
        <div class="sub" style="font-size:12.5px;color:var(--text2);margin-top:3px">Último: ${al.lastLog.date} · ${fmt(al.lastLog.km_after||0)} km · intervalo ${fmt(svc.interval)} km</div>
        <div class="bar" style="height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:11px"><i style="display:block;height:100%;border-radius:99px;width:${barPct}%;background:${barColor}"></i></div>
        <button class="btn-ghost-lg" style="margin-top:12px" onclick="navigate('/unidad/${uid_}/aceite/${tipoSlug[svc.type]}')">Registrar cambio</button>`;
    }
    h+=`</div>`;
  });
  return h;
}

async function doSaveLog(busId){
  if(ST.saving) return;
  const bus=ST.buses.find(b=>b.id===busId);
  if(!bus) return;
  const date=document.getElementById('lm-date').value;
  if(!date){ ST.modalErr='La fecha es obligatoria.'; render(); return; }
  const type=document.getElementById('lm-type').value;
  const kmVal=document.getElementById('lm-km').value;
  const costVal=document.getElementById('lm-cost').value;
  if(kmVal===''){ ST.modalErr='El odómetro es obligatorio.'; render(); return; }
  if(costVal===''){ ST.modalErr='El costo es obligatorio.'; render(); return; }
  const kmRaw=parseInt(kmVal)||0;
  const desc=document.getElementById('lm-desc').value.trim();
  const cost=parseFloat(costVal)||0;
  const tech=document.getElementById('lm-tech').value.trim();
  const kmAfter=Math.max(kmRaw,bus.km);
  const prevKm=bus.km;
  bus.km=kmAfter;
  const log={id:uid(),bus_id:busId,city:bus.city,type,date,description:desc,cost,technician:tech,km_after:kmAfter,ts:Date.now()};
  ST.logs.unshift(log);
  ST.saving=true; ST.modalErr=''; render();
  const {error:e1}=await dbSaveBus(bus);
  const {error:e2}=await dbSaveLog(log);
  if(e1||e2){
    bus.km=prevKm; ST.logs=ST.logs.filter(l=>l.id!==log.id);
    ST.saving=false; ST.modalErr='Error al guardar. Intenta de nuevo.'; render(); return;
  }
  ST.saving=false; ST.modal=null; ST.modalErr='';
  navigate('/unidad/'+encodeURIComponent(busId)+'/historial');
  showToast('Registro guardado');
}

async function doSaveTire(busId){
  if(ST.saving) return;
  const bus=ST.buses.find(b=>b.id===busId);
  if(!bus) return;
  const date=document.getElementById('tm-date').value;
  if(!date){ ST.modalErr='La fecha es obligatoria.'; render(); return; }
  const pos=document.getElementById('tm-pos').value;
  const event=document.getElementById('tm-event').value;
  const kmVal=document.getElementById('tm-km').value;
  const costVal=document.getElementById('tm-cost').value;
  if(kmVal===''){ ST.modalErr='El odómetro es obligatorio.'; render(); return; }
  if(costVal===''){ ST.modalErr='El costo es obligatorio.'; render(); return; }
  const kmRaw=parseInt(kmVal)||0;
  const brand=document.getElementById('tm-brand').value.trim();
  const cond=document.getElementById('tm-cond').value;
  const cost=parseFloat(costVal)||0;
  const notes=document.getElementById('tm-notes').value.trim();
  const kmAfter=Math.max(kmRaw,bus.km);
  // snapshot for rollback
  const prevKm=bus.km;
  const prevTires=JSON.parse(JSON.stringify(bus.tires||{}));
  if(!bus.tires) bus.tires={};
  const histEntry={date,event:TIRE_EVENTS[event],brand,kmAt:kmAfter,notes};
  const prev=bus.tires[pos];
  if(event==='rotate'){
    const dest=document.getElementById('tm-dest').value;
    const srcTire={...(prev||{})};
    const dstTire=bus.tires[dest]?{...bus.tires[dest]}:null;
    const rotEntry={date,event:TIRE_EVENTS['rotate'],brand:srcTire.brand||brand,kmAt:kmAfter,notes};
    bus.tires[dest]={brand:srcTire.brand||brand,installDate:date,kmAt:kmAfter,cond,history:[rotEntry,...(srcTire.history||[])]};
    if(dstTire){
      const swapEntry={date,event:TIRE_EVENTS['rotate'],brand:dstTire.brand||'',kmAt:kmAfter,notes};
      bus.tires[pos]={...dstTire,installDate:date,kmAt:kmAfter,history:[swapEntry,...(dstTire.history||[])]};
    } else { delete bus.tires[pos]; }
    bus.km=kmAfter;
    const arrow=dstTire?'↔':'→';
    const desc=`Rotación: ${POS_NAMES[pos]} ${arrow} ${POS_NAMES[dest]}${srcTire.brand?' · '+srcTire.brand:''}`;
    const log={id:uid(),bus_id:busId,city:bus.city,type:'tire',date,description:desc,cost,km_after:kmAfter,ts:Date.now()};
    ST.logs.unshift(log);
    ST.saving=true; ST.modalErr=''; render();
    const {error:e1}=await dbSaveLog(log);
    const {error:e2}=await dbSaveBus(bus);
    if(e1||e2){
      bus.km=prevKm; bus.tires=prevTires; ST.logs=ST.logs.filter(l=>l.id!==log.id);
      ST.saving=false; ST.modalErr='Error al guardar. Intenta de nuevo.'; render(); return;
    }
    ST.saving=false; ST.modal=null; ST.tirePrePos=null; ST.tirePreEvent=null; ST.modalErr=''; ST.selTire=dest;
    navigate('/unidad/'+encodeURIComponent(busId)+'/mantenimiento');
    showToast(`Rotación guardada: ${POS_NAMES[pos]} ${arrow} ${POS_NAMES[dest]}`);
    return;
  }
  if(event==='retire'){
    if(prev){ if(!prev.history)prev.history=[]; prev.history.unshift(histEntry); prev.cond='worn'; }
  } else {
    bus.tires[pos]={brand:brand||(prev?.brand||''),installDate:date,kmAt:kmAfter,cond,history:[histEntry,...(prev?.history||[])]};
  }
  bus.km=kmAfter;
  const logEntry={id:uid(),bus_id:busId,city:bus.city,type:'tire',date,description:`${TIRE_EVENTS[event]} · ${POS_NAMES[pos]}${brand?' · '+brand:''}`,cost,km_after:kmAfter,ts:Date.now()};
  ST.logs.unshift(logEntry);
  ST.saving=true; ST.modalErr=''; render();
  const {error:e1}=await dbSaveBus(bus);
  const {error:e2}=await dbSaveLog(logEntry);
  if(e1||e2){
    bus.km=prevKm; bus.tires=prevTires;
    ST.logs=ST.logs.filter(l=>l.id!==logEntry.id);
    ST.saving=false; ST.modalErr='Error al guardar. Intenta de nuevo.'; render(); return;
  }
  ST.saving=false; ST.modal=null; ST.tirePrePos=null; ST.tirePreEvent=null; ST.modalErr=''; ST.selTire=pos;
  navigate('/unidad/'+encodeURIComponent(busId)+'/mantenimiento');
}

async function doSaveBus(){
  if(ST.saving) return;
  const name=document.getElementById('bm-name').value.trim();
  if(!name){ ST.modalErr='El nombre es obligatorio'; render(); return; }
  const type=document.getElementById('bm-type').value;
  const client=document.getElementById('bm-client').value;
  const city=document.getElementById('bm-city').value;
  const km=parseInt(document.getElementById('bm-km').value)||0;
  const bus={id:uid(),name,type,client,city,km,tires:{}};
  ST.buses.push(bus);
  ST.saving=true; ST.modalErr=''; render();
  const {error}=await dbSaveBus(bus);
  if(error){
    ST.buses=ST.buses.filter(b=>b.id!==bus.id);
    ST.saving=false; ST.modalErr='Error al guardar. Intenta de nuevo.'; render(); return;

async function doSaveServiceLog(busId, svcType, pfx){
  if(ST.saving) return;
  const bus=ST.buses.find(b=>b.id===busId);
  if(!bus) return;
  const date=document.getElementById(`sv-${pfx}-date`).value;
  const kmVal=document.getElementById(`sv-${pfx}-km`).value;
  const costVal=document.getElementById(`sv-${pfx}-cost`).value;
  if(!date){ ST.modalErr='La fecha es obligatoria.'; ST.svcErrType=svcType; render(); return; }
  if(kmVal===''){ ST.modalErr='El odómetro es obligatorio.'; ST.svcErrType=svcType; render(); return; }
  if(costVal===''){ ST.modalErr='El costo es obligatorio.'; ST.svcErrType=svcType; render(); return; }
  const kmRaw=parseInt(kmVal)||0;
  const brand=document.getElementById(`sv-${pfx}-brand`).value.trim();
  const cost=parseFloat(costVal)||0;
  const svcLabels={svc:'Aceite de motor',svc_trans:'Aceite de transmisión',svc_diff:'Aceite diferencial'};
  const parts=[svcLabels[svcType]||svcType];
  if(brand) parts.push(brand);
  if(svcType==='svc'){
    const extras=[
      ['sv-e-cb-fuel','Filtro de combustible'],['sv-e-cb-air','Filtro de aire'],
      ['sv-e-cb-sec','Filtro secundario'],['sv-e-cb-oilf','Filtro de aceite'],
      ['sv-e-cb-spark','Bujías']
    ].filter(([id])=>document.getElementById(id)?.checked).map(([,lbl])=>lbl);
    if(extras.length) parts.push(extras.join(', '));
  }
  const kmAfter=Math.max(kmRaw,bus.km);
  const prevKm=bus.km;
  bus.km=kmAfter;
  const desc=parts.join(' · ');
  const log={id:uid(),bus_id:busId,city:bus.city,type:svcType,date,description:desc,cost,km_after:kmAfter,ts:Date.now()};
  ST.logs.unshift(log);
  ST.saving=true; ST.modalErr=''; ST.svcErrType=null; render();
  const {error:e1}=await dbSaveBus(bus);
  const {error:e2}=await dbSaveLog(log);
  if(e1||e2){
    bus.km=prevKm; ST.logs=ST.logs.filter(l=>l.id!==log.id);
    ST.saving=false; ST.modalErr='Error al guardar. Intenta de nuevo.'; ST.svcErrType=svcType; render(); return;
  }
  ST.saving=false; ST.modalErr='';
  navigate('/unidad/'+encodeURIComponent(busId)+'/servicio');
  showToast(`${svcLabels[svcType]||'Servicio'} registrado`);
}

function showClErr(msg){ const el=document.getElementById('cl-form-err'); if(el){ el.textContent=msg; el.style.display=msg?'block':'none'; } }

async function doSaveChecklist(busId){
  if(ST.saving) return;
  const bus=ST.buses.find(b=>b.id===busId);
  if(!bus) return;
  // Odómetro: primer campo obligatorio y validado antes que el resto.
  const kmVal=(document.getElementById('cl-km')?.value||'').trim();
  if(kmVal===''){ showClErr('El odómetro es obligatorio.'); return; }
  const km=parseInt(kmVal,10);
  if(isNaN(km)||km<0){ showClErr('El odómetro no es un número válido.'); return; }
  const lastKm=bus.km||0;
  if(lastKm>0 && km<lastKm){ showClErr(`El odómetro (${fmt(km)} km) no puede ser menor que la última lectura registrada (${fmt(lastKm)} km).`); return; }
  if(lastKm>0){
    const lastLog=busLogs(bus.id).find(l=>l.km_after||l.kmAfter);
    const days=lastLog?.date ? Math.max(1,Math.round((new Date(today())-new Date(lastLog.date))/86400000)) : 1;
    const jump=km-lastKm;
    if(jump>2000*days && !confirm(`Salto de ${fmt(jump)} km desde la última lectura (${days} día${days===1?'':'s'}). ¿Es correcto?`)) return;
  }
  const conductor=(document.getElementById('cl-conductor')?.value||'').trim();
  const fecha=document.getElementById('cl-fecha')?.value;
  if(!conductor){ showClErr('El conductor/operador es obligatorio.'); return; }
  if(!fecha){ showClErr('La fecha es obligatoria.'); return; }
  const supervisor=(document.getElementById('cl-supervisor')?.value||'').trim();
  if(!supervisor){ showClErr('El supervisor es obligatorio.'); return; }
  showClErr('');
  const kmAfter=km;
  const data={
    conductor,
    supervisor,
    hora:document.getElementById('cl-hora')?.value||'',
    combustible:parseFloat(document.getElementById('cl-combustible')?.value)||0,
    docs:clReadBool('cl-docs',CL_DOCS),
    externo:clReadBool('cl-externo',CL_EXTERNO),
    carroceria:clReadBMN('cl-carroceria',CL_CARROCERIA),
    llantas:clReadBMN('cl-llantas',CL_LLANTAS),
    luces:clReadBool('cl-luces',CL_LUCES),
    niveles:clReadBMN('cl-niveles',CL_NIVELES),
    reparaciones:(document.getElementById('cl-reparaciones')?.value||'').trim(),
  };
  data.passed=!(
    Object.values(data.docs).some(v=>v===false)||
    Object.values(data.carroceria).some(v=>v==='M')||
    Object.values(data.llantas).some(v=>v==='M')||
    Object.values(data.niveles).some(v=>v==='M')
  );
  const prevKm=bus.km;
  bus.km=kmAfter;
  const prevIssues=JSON.parse(JSON.stringify(bus.open_issues||[]));
  if(data.reparaciones){
    if(!bus.open_issues) bus.open_issues=[];
    bus.open_issues.push({id:uid(),text:data.reparaciones,date:fecha,resolved:false});
  }
  const log={id:uid(),bus_id:busId,city:bus.city,type:'checklist',date:fecha,description:'__CL__'+JSON.stringify(data),cost:0,km_after:kmAfter,ts:Date.now()};
  ST.logs.unshift(log);
  ST.saving=true; render();
  const {error:e1}=await dbSaveBus(bus);
  const {error:e2}=await dbSaveLog(log);
  if(e1||e2){
    bus.km=prevKm; bus.open_issues=prevIssues; ST.logs=ST.logs.filter(l=>l.id!==log.id);
    ST.saving=false; ST.clView='form'; render();
    showClErr('Error al guardar. Intenta de nuevo.'); return;
  }
  // Golpes nuevos marcados en el checklist -> expediente `danos` (origen checklist).
  if(ST.clPins.length){
    const clLogs=busLogs(busId).filter(l=>l.type==='checklist');
    const prevCl=clLogs[1]||null;  // clLogs[0] es el que acabamos de agregar
    const danoRows=ST.clPins.map(p=>({
      id:uid(), bus_id:busId, x:p.x, y:p.y, descripcion:p.descripcion, severidad:p.severidad,
      fotos:[], estado:'activo', origen:'checklist', inspeccion_id:log.id,
      operador_texto:conductor, base_id:null, detectado_ts:log.ts,
      prev_base_id:null, prev_ts:prevCl?.ts||null, fecha_deteccion:fecha
    }));
    const {error:eD}=await dbInsertDanos(danoRows);
    if(eD) showToast('Inspección guardada, pero no se registraron los golpes nuevos.','error');
    else ST.danos.push(...danoRows);
    ST.clPins=[];
  }
  ST.saving=false; ST.clView='history';
  navigate('/unidad/'+encodeURIComponent(busId)+'/checklist');
  showToast(`Inspección ${data.passed?'aprobada ✓':'con observaciones'} guardada`);
}

async function doResolveIssue(busId,issueId){
  const bus=ST.buses.find(b=>b.id===busId);
  if(!bus) return;
  const iss=(bus.open_issues||[]).find(i=>i.id===issueId);
  if(!iss||iss.resolved) return;
  iss.resolved=true;
  render();
  const {error}=await dbSaveBus(bus);
  if(error){ iss.resolved=false; showToast('Error al actualizar. Intenta de nuevo.','error'); render(); }
  else showToast('Acción resuelta');
}

function exportCSV(){
  const isAdmin=ST.role==='admin';
  const rows=applyReportFilters();
  if(!rows.length) return;
  const typeLabels={...LOG_TYPES,tire:'Llanta'};
  const headers=['Fecha','Unidad','Ciudad','Cliente','Tipo','Subtipo','Descripcion','KM','Tecnico'];
  if(isAdmin) headers.push('Costo MXN');
  const lines=[headers.join(',')];
  rows.forEach(l=>{
    const bus=ST.buses.find(b=>b.id===(l.bus_id||l.busId));
    const cells=[
      l.date,
      `"${(bus?.name||'').replace(/"/g,'""')}"`,
      CITIES[bus?.city]?.name||bus?.city||'',
      bus?.client||'',
      typeLabels[l.type]||l.type,
      `"${getSubtipo(l).replace(/"/g,'""')}"`,
      `"${(l.description||l.desc||'').replace(/"/g,'""')}"`,
      l.km_after||l.kmAfter||'',
      `"${(l.technician||l.tech||'').replace(/"/g,'""')}"`
    ];
    if(isAdmin) cells.push(l.cost||0);
    lines.push(cells.join(','));
  });
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`reporte_ate_${today()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// ─── ROUTER (History API) ────────────────────────────────────────────────────
// Cada pantalla es una URL real. navigate() empuja al historial del navegador;
// popstate (botón atrás del navegador y gesto de atrás del celular) re-deriva el
// estado desde la URL. Los links directos abren esa pantalla con esa unidad.
// Producción: vercel.json reescribe las rutas sin extensión a index.html.
const TAB_SLUGS = {  // slug en la URL  ->  ST.tab interno (3 tabs; resumen = default sin slug)
  mantenimiento:'mantenimiento', inspecciones:'inspecciones'
};
const TAB_SLUG_BY_TAB = Object.fromEntries(Object.entries(TAB_SLUGS).map(([slug,tab])=>[tab,slug]));
// Slugs viejos (7 tabs, antes de consolidar) -> tab nuevo, para no romper links.
const LEGACY_TAB = { status:'resumen', servicio:'mantenimiento', llantas:'mantenimiento',
  reparaciones:'mantenimiento', checklist:'inspecciones', chequeo:'inspecciones', historial:'inspecciones' };
const HUB_SLUGS   = { reportes:'report', chequeos:'chequeos', compras:'compras' };
const HUB_SLUG_BY_VIEW = Object.fromEntries(Object.entries(HUB_SLUGS).map(([slug,view])=>[view,slug]));
const ACEITE_SLUGS = { motor:'svc', transmision:'svc_trans', diferencial:'svc_diff' };
const ACEITE_SLUG_BY_TYPE = { svc:'motor', svc_trans:'transmision', svc_diff:'diferencial' };
// Acciones que son pantalla propia (header pegajoso + barra de guardar inferior).
const ACTION_SLUGS = new Set(['aceite','reparacion','registro','checklist-nuevo','golpes','chequeo-nuevo']);

function parsePath(pathname){
  const seg = decodeURIComponent(pathname).replace(/^\/+|\/+$/g,'').split('/').filter(Boolean);
  if(!seg.length) return {view:'fleet'};
  if(HUB_SLUGS[seg[0]]) return {view:HUB_SLUGS[seg[0]]};
  if(seg[0]==='unidad' && seg[1]){
    const r={view:'fleet', busId:seg[1]};
    const sub=seg[2];
    if(!sub){ r.tab='resumen'; return r; }
    if(TAB_SLUGS[sub]){ r.tab=TAB_SLUGS[sub]; return r; }
    if(ACTION_SLUGS.has(sub)){ r.action=sub; if(sub==='aceite'&&seg[3]) r.actionParam=seg[3]; return r; }
    if(LEGACY_TAB[sub]){ r.tab=LEGACY_TAB[sub]; return r; }
    r.tab='resumen'; return r;
  }
  return {view:'fleet'};
}

// URL canónica del estado actual (para replaceState al abrir acciones/modales).
function pathForState(){
  if(ST.busId){
    let p='/unidad/'+encodeURIComponent(ST.busId);
    if(ST.action){ p+='/'+ST.action; if(ST.action==='aceite'&&ST.actionParam) p+='/'+ST.actionParam; }
    else if(ST.tab && ST.tab!=='resumen') p+='/'+(TAB_SLUG_BY_TAB[ST.tab]||ST.tab);
    return p;
  }
  return HUB_SLUG_BY_VIEW[ST.view] ? '/'+HUB_SLUG_BY_VIEW[ST.view] : '/';
}

function applyRoute(){
  const r=parsePath(location.pathname);
  ST.view=r.view||'fleet';
  ST.busId=r.busId||null;
  ST.tab=r.tab||'resumen';
  ST.action=r.action||null;
  ST.actionParam=r.actionParam||null;
  ST.selService = (r.action==='aceite') ? (ACEITE_SLUGS[r.actionParam]||null) : null;
  ST.selTire=null; ST.modal=null; ST.modalErr='';
  // Al entrar a una inspección de checklist, precarga golpes activos (gris) y limpia los nuevos.
  if(r.action==='checklist-nuevo' && r.busId){
    ST.clPrevPins=activeDanos(r.busId).map(d=>({x:Number(d.x),y:Number(d.y),descripcion:d.descripcion,severidad:d.severidad}));
    ST.clPins=[]; ST.clPinDraft=null;
  }
}

// Navegación central: todo cambio de PANTALLA pasa por aquí para que el
// historial y el botón atrás funcionen. Los cambios que no son de pantalla
// (filtros, toggles de formulario) siguen usando render() directo.
function navigate(path, opts){
  opts=opts||{};
  if(typeof path!=='string') path=pathForState();
  if(opts.replace) history.replaceState({}, '', path);
  else history.pushState({}, '', path);
  applyRoute();
  render();
  window.scrollTo(0,0);
}
function goBack(){ history.length>1 ? history.back() : navigate('/'); }

window.addEventListener('popstate', ()=>{ applyRoute(); render(); });

// keyboard shortcut: Enter on password field
document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!ST.auth){ doLogin(); } });

async function boot(){
  await init();          // auth + carga de datos + primer render
  applyRoute();          // deriva la pantalla desde la URL (deep links)
  render();
}
boot();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
